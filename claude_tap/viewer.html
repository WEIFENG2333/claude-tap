    errBtn.className = 'filter-chip filter-chip-errors' + (errorsOnlyFilter ? ' active' : '');
    errBtn.title = t('errors_only') || 'Errors only';
    errBtn.innerHTML = `<span style="color:var(--red);font-weight:600">●</span> ${esc(t('errors_only') || 'Errors only')}`;
    errBtn.onclick = () => { errorsOnlyFilter = !errorsOnlyFilter; applyFilter(); renderPathFilter(paths, pathCounts); };
    c.appendChild(errBtn);
  }
}

function makeFilterChip(p, count) {
  const chip = document.createElement('button');
  chip.className = 'filter-chip' + (activePaths.has(p) ? ' active' : '');
  /* Truncate long paths: show last 40 chars with ellipsis */
  const label = p.length > 40 ? '\u2026' + p.slice(-39) : p;
  chip.innerHTML = `<span title="${esc(p)}">${esc(label)}</span><span class="chip-count">${count}</span>`;
  chip.title = p;
  chip.onclick = () => {
    userTouchedPathFilter = true;
    if (activePaths.has(p)) activePaths.delete(p); else activePaths.add(p);
    if (activePaths.size === 0) activePaths.add(p);  // never let the user filter to empty
    // Sync class from authoritative state — the "size became 0" branch above
    // can leave a blind classList.toggle out of sync with the Set.
    chip.classList.toggle('active', activePaths.has(p));
    applyFilter();
  };
  return chip;
}

function applyFilter(preserveDetail) {
  filtered = entries.filter(e => activePaths.has(getPath(e)));
  if (errorsOnlyFilter) filtered = filtered.filter(e => (getResponseStatus(e) || 0) >= 400);
  if (searchQuery) filtered = filtered.filter(e => matchSearch(e, searchQuery));
  if (activeTools) {
    filtered = filtered.filter(e => {
      const ro = getResponseOutput(e);
      const rc = ro?.content;
      if (!Array.isArray(rc)) return false;
      return rc.some(b => b.type === 'tool_use' && activeTools.has(b.name));
    });
  }
  filtered.sort((a, b) => (a.turn || 0) - (b.turn || 0));
  renderToolFilter();
  renderSidebar(preserveDetail);
  updatePositionIndicator();
}

// Tool-name set derived from response.output. Cached because applyFilter
// fires on every keystroke and walking N entries × M output blocks is hot.
let _toolSetCache = null;
let _toolSetCacheKey = null;
function getKnownToolNames() {
  // Cache key tracks both length and last record's request_id so live
  // appends invalidate without a stale cache.
  const key = entries.length + ':' + (entries.length ? (entries[entries.length - 1].request_id || '') : '');
  if (_toolSetCacheKey === key && _toolSetCache) return _toolSetCache;
  const out = new Set();
  for (const e of entries) {
    const rc = e._isStub ? e.response?.body?.content : getResponseOutput(e)?.content;
    if (Array.isArray(rc)) for (const b of rc) if (b.type === 'tool_use' && b.name) out.add(b.name);
  }
  _toolSetCache = out;
  _toolSetCacheKey = key;
  return out;
}

function renderToolFilter() {
  const tf = $('#tool-filter');
  const toolSet = getKnownToolNames();
  if (toolSet.size === 0) { tf.style.display = 'none'; return; }
  tf.style.display = '';
  const tools = [...toolSet].sort();
  tf.innerHTML = '<div style="margin-bottom:3px;font-weight:600;color:var(--text-secondary)">Tools</div>' +
    tools.map(name => {
      const active = activeTools ? activeTools.has(name) : false;
      // data-tool carries the raw name; #tool-filter has a delegated click
      // listener (initToolFilterEvents) so we don't string-concat into
      // an onclick attribute.
      return `<button class="tool-chip${active ? ' active' : ''}" data-tool="${esc(name)}">${esc(name)}</button>`;
    }).join('') +
    (activeTools ? `<button class="tool-chip is-clear" data-tool-clear="1">✕ Clear</button>` : '');
}
function toggleToolFilter(name) {
  if (!activeTools) activeTools = new Set();
  if (activeTools.has(name)) { activeTools.delete(name); if (activeTools.size === 0) activeTools = null; }
  else activeTools.add(name);
  applyFilter();
}
function clearToolFilter() { activeTools = null; applyFilter(); }
// One delegated click handler — registered once at boot.
function initToolFilterEvents() {
  const tf = document.getElementById('tool-filter');
  if (!tf || tf._wired) return;
  tf._wired = true;
  tf.addEventListener('click', ev => {
    const btn = ev.target.closest('button.tool-chip');
    if (!btn) return;
    if (btn.dataset.toolClear) clearToolFilter();
    else if (btn.dataset.tool) toggleToolFilter(btn.dataset.tool);
  });
}

/* ─── Search ─── */
// Debounce search-input keystrokes — applyFilter walks every entry, which
// gets noticeable on traces with many records.
let _searchDebounceTimer = null;
function onSearch(value) {
  searchQuery = value.toLowerCase().trim();
  $('#search-clear').style.display = searchQuery ? '' : 'none';
  clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer = setTimeout(applyFilter, 120);
}
function clearSearch() {
  searchQuery = '';
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  applyFilter();
}
function matchSearch(e, q) {
  if (e._isStub) {
    // In lazy mode: search metadata fields only (fast, no parsing)
    const model = e.request?.body?.model || '';
    if (model.toLowerCase().includes(q)) return true;
    const path = e.request?.path || '';
    if (path.toLowerCase().includes(q)) return true;
    const sys = e.request?.body?.system || '';
    if (sys.toLowerCase().includes(q)) return true;
    const turn = String(e.turn || '');
    if (turn.includes(q)) return true;
    const tools = getTools(e.request?.body);
    for (const td of tools) {
      if (getToolName(td).toLowerCase().includes(q)) return true;
    }
    const rc = e.response?.body?.content;
    if (Array.isArray(rc)) {
      for (const block of rc) {
        if ((block.name || '').toLowerCase().includes(q)) return true;
      }
    }
    return false;
  }
  const body = e.request?.body;
  if ((body?.model || '').toLowerCase().includes(q)) return true;
  const sys = extractSystem(body) || '';
  if (sys.toLowerCase().includes(q)) return true;
  const msgs = getMessages(body);
  for (const m of msgs) {
    const mc = typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
    if (mc.toLowerCase().includes(q)) return true;
  }
  const tools = getTools(body);
  for (const td of tools) {
    const definition = td.function && typeof td.function === 'object' ? td.function : td;
    if (getToolName(td).toLowerCase().includes(q)) return true;
    if ((definition.description || td.description || '').toLowerCase().includes(q)) return true;
  }
  const ro = getResponseOutput(e);
  const rc = ro?.content;
  if (Array.isArray(rc)) {
    for (const block of rc) {
      if ((block.text || block.name || '').toLowerCase().includes(q)) return true;
    }
  }
  return false;
}

/* ─── Global search (Cmd/Ctrl+K) ─── */
function initGlobalSearch() {
  const input = $('#global-search-input');
  $('#global-search-prev').onclick = () => navigateGlobalSearch(-1);
  $('#global-search-next').onclick = () => navigateGlobalSearch(1);
  $('#global-search-close').onclick = () => closeGlobalSearch();
  input.addEventListener('input', () => {
    globalSearchState.query = input.value.trim();
    recalcGlobalSearchMatches();
  });
}

function openGlobalSearch() {
  // Snapshot the user's filter state so we can restore it on close. Without
  // this, normalizeFiltersForGlobalSearch() permanently wipes their path /
  // tool / search-bar selections.
  globalSearchState.savedFilters = {
    activePaths: new Set(activePaths),
    activeTools: activeTools ? new Set(activeTools) : null,
    searchQuery: searchQuery,
    userTouchedPathFilter: userTouchedPathFilter,
  };
  normalizeFiltersForGlobalSearch();
  globalSearchState.open = true;
  $('#global-search-overlay').classList.add('open');
  const input = $('#global-search-input');
  input.value = globalSearchState.query;
  input.focus();
  input.select();
  recalcGlobalSearchMatches();
}

function closeGlobalSearch() {
  globalSearchState.open = false;
  globalSearchState.query = '';
  globalSearchState.matchCounts = [];
  globalSearchState.totalMatches = 0;
  globalSearchState.currentMatch = -1;
  $('#global-search-input').value = '';
  $('#global-search-overlay').classList.remove('open');
  clearGlobalSearchHighlights($('#detail'));
  updateGlobalSearchCount();
  const saved = globalSearchState.savedFilters;
  if (saved) {
    activePaths = saved.activePaths;
    activeTools = saved.activeTools;
    searchQuery = saved.searchQuery;
    userTouchedPathFilter = saved.userTouchedPathFilter;
    if ($('#search-input')) $('#search-input').value = saved.searchQuery;
    if ($('#search-clear')) $('#search-clear').style.display = saved.searchQuery ? '' : 'none';
    globalSearchState.savedFilters = null;
    applyFilter(true);
  }
}

function normalizeFiltersForGlobalSearch() {
  // Global search must be able to move across all entries.
  let changed = false;
  const allPaths = new Set(entries.map(getPath));
  if (activePaths.size !== allPaths.size) { activePaths = allPaths; changed = true; }
  if (activeTools) { activeTools = null; changed = true; }
  if (searchQuery) {
    searchQuery = '';
    if ($('#search-input')) $('#search-input').value = '';
    if ($('#search-clear')) $('#search-clear').style.display = 'none';
    changed = true;
  }
  if (changed) applyFilter(true);
}

function getEntrySearchText(entry) {
  if (!entry?.request_id) return '';
  if (globalSearchState.textCache.has(entry.request_id)) return globalSearchState.textCache.get(entry.request_id);
  // For stubs, parse the full entry first
  const resolved = entry._isStub ? getFullEntry(entry) : entry;
  const body = resolved.request?.body;
  const parts = [];
  parts.push(body?.model || '');
  parts.push(extractSystem(body) || '');
  getMessages(body).forEach(m => parts.push(msgToText(m)));
  getTools(body).forEach(td => parts.push(JSON.stringify(td)));
  const output = getResponseOutput(resolved);
  if (output?.content) parts.push(msgToText({ role: 'assistant', content: output.content }));
  getResponseEvents(resolved).forEach(ev => parts.push(JSON.stringify(ev)));
  parts.push(JSON.stringify(resolved));
  const text = parts.join('\n').toLowerCase();
  globalSearchState.textCache.set(entry.request_id, text);
  return text;
}

function countMatchesInText(text, query) {
  if (!text || !query) return 0;
  return text.split(query).length - 1;
}

function recalcGlobalSearchMatches() {
  clearGlobalSearchHighlights($('#detail'));
  const query = globalSearchState.query.toLowerCase();
  if (!query) {
    globalSearchState.matchCounts = [];
    globalSearchState.totalMatches = 0;
    globalSearchState.currentMatch = -1;
    updateGlobalSearchCount();
    return;
  }
  const counts = [];
  let total = 0;
  entries.forEach(entry => {
    const c = countMatchesInText(getEntrySearchText(entry), query);
    if (c > 0) counts.push({ requestId: entry.request_id, count: c });
    total += c;
  });
  globalSearchState.matchCounts = counts;
  globalSearchState.totalMatches = total;
  globalSearchState.currentMatch = total > 0 ? 0 : -1;
  updateGlobalSearchCount();
  revealCurrentSearchMatch();
}

function updateGlobalSearchCount() {
  const total = globalSearchState.totalMatches;
  const current = total > 0 ? (globalSearchState.currentMatch + 1) : 0;
  const label = total > 0 ? `${current} of ${total} matches` : '0 of 0';
  $('#global-search-count').textContent = label;
}

function getTargetForGlobalMatch(globalIndex) {
  let seen = 0;
  for (const row of globalSearchState.matchCounts) {
    if (globalIndex < seen + row.count) {
      return { requestId: row.requestId, localIndex: globalIndex - seen };
    }
    seen += row.count;
  }
  return null;
}

function findFilteredIdxByRequestId(requestId) {
  return filtered.findIndex(entry => entry.request_id === requestId);
}

function ensureEntryVisibleForSearch(requestId) {
  let idx = findFilteredIdxByRequestId(requestId);
  if (idx < 0) {
    normalizeFiltersForGlobalSearch();
    idx = findFilteredIdxByRequestId(requestId);
  }
  if (idx < 0) return -1;
  const model = filtered[idx]?.request?.body?.model || 'unknown';
  if (collapsedGroups.has(model)) {
    collapsedGroups.delete(model);
    renderSidebar(true);
    idx = findFilteredIdxByRequestId(requestId);
  }
  return idx;
}

function navigateGlobalSearch(delta) {
  if (!globalSearchState.totalMatches) return;
  const total = globalSearchState.totalMatches;
  globalSearchState.currentMatch = (globalSearchState.currentMatch + delta + total) % total;
  updateGlobalSearchCount();
  revealCurrentSearchMatch();
}

function revealCurrentSearchMatch() {
  const target = getTargetForGlobalMatch(globalSearchState.currentMatch);
  if (!target) return;
  const filteredIdx = ensureEntryVisibleForSearch(target.requestId);
  if (filteredIdx < 0) return;
  selectEntry(filteredIdx);
  applyGlobalSearchHighlights(target.localIndex);
}

function applyGlobalSearchHighlights(targetLocalIndex) {
  const detail = $('#detail');
  if (!detail) return;
  clearGlobalSearchHighlights(detail);
  const query = globalSearchState.query.toLowerCase();
  if (!query) return;
  const marks = highlightSearchInContainer(detail, query);
  autoExpandSearchMatches(marks);
  if (!marks.length) return;
  let idx = targetLocalIndex;
  if (idx < 0 || idx >= marks.length) idx = 0;
  marks.forEach((mark, i) => mark.classList.toggle('current', i === idx));
  marks[idx].scrollIntoView({ block: 'center' });
}

function clearGlobalSearchHighlights(container) {
  if (!container) return;
  container.querySelectorAll('mark.global-search-hit').forEach(mark => {
    mark.replaceWith(document.createTextNode(mark.textContent || ''));
  });
  container.normalize();
}

function highlightSearchInContainer(container, query) {
  if (!query) return [];
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (parent.closest('#global-search-overlay')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  const marks = [];
  textNodes.forEach(node => {
    const value = node.nodeValue;
    const lower = value.toLowerCase();
    let from = 0;
    let found = lower.indexOf(query, from);
    if (found === -1) return;
    const frag = document.createDocumentFragment();
    while (found !== -1) {
      if (found > from) frag.appendChild(document.createTextNode(value.slice(from, found)));
      const mark = document.createElement('mark');
      mark.className = 'global-search-hit';
      mark.textContent = value.slice(found, found + query.length);
      frag.appendChild(mark);
      marks.push(mark);
      from = found + query.length;
      found = lower.indexOf(query, from);
    }
    if (from < value.length) frag.appendChild(document.createTextNode(value.slice(from)));
    node.parentNode.replaceChild(frag, node);
  });
  return marks;
}

function autoExpandSearchMatches(marks) {
  marks.forEach(mark => {
    const sectionBody = mark.closest('.section-body');
    if (sectionBody && !sectionBody.classList.contains('open')) {
      sectionBody.classList.add('open');
      sectionBody.previousElementSibling?.querySelector('.chevron')?.classList.add('open');
    }
    const toolBody = mark.closest('.tool-block-body');
    if (toolBody && !toolBody.classList.contains('open')) {
      toolBody.classList.add('open');
      toolBody.previousElementSibling?.querySelector('.tb-arrow')?.classList.add('open');
    }
  });
}

/* ─── Model helpers ─── */
function modelPriority(m) {
  const l = m.toLowerCase();
  if (l.includes('opus')) return 0;
  if (l.includes('sonnet')) return 1;
  if (l.includes('haiku')) return 3;
  return 2;
}
function modelColor(m) {
  const l = m.toLowerCase();
  if (l.includes('opus')) return 'var(--purple)';
  if (l.includes('sonnet')) return 'var(--blue)';
  if (l.includes('haiku')) return 'var(--green)';
  return 'var(--text-tertiary)';
}
function modelBadge(m) {
  const l = m.toLowerCase();
  if (l.includes('opus')) return { bg: 'var(--purple-bg)', fg: 'var(--purple)' };
  if (l.includes('sonnet')) return { bg: 'var(--blue-bg)', fg: 'var(--blue)' };
  if (l.includes('haiku')) return { bg: 'var(--green-bg)', fg: 'var(--green)' };
  return { bg: 'var(--bg)', fg: 'var(--text-tertiary)' };
}

/* ─── Visual order helpers ─── */
function buildVisualOrder() {
  if (virtualMode) {
    visualOrder = vsFilteredItems.map(item => item.idx);
    return;
  }
  visualOrder = [];
  document.querySelectorAll('.sidebar-item').forEach(el => {
    // Skip items whose parent container is collapsed (display: none)
    if (el.parentElement && el.parentElement.style.display === 'none') return;
    visualOrder.push(parseInt(el.dataset.idx));
  });
}

function visualNavigate(delta) {
  if (!visualOrder.length) return;
  const pos = visualOrder.indexOf(activeIdx);
  if (pos === -1) { selectEntry(visualOrder[0]); return; }
  const next = Math.max(0, Math.min(pos + delta, visualOrder.length - 1));
  selectEntry(visualOrder[next]);
}

/* ─── Sidebar ─── */
const collapsedGroups = new Set(); // Track collapsed model groups

/* ─── Task type fingerprinting ─── */
const TASK_COLORS = [
  { color: 'var(--blue)',   bg: 'var(--blue-bg)' },
  { color: 'var(--green)',  bg: 'var(--green-bg)' },
  { color: 'var(--purple)', bg: 'var(--purple-bg)' },
  { color: 'var(--amber)',  bg: 'var(--amber-bg)' },
  { color: 'var(--cyan)',   bg: 'var(--cyan-bg)' },
  { color: 'var(--orange)', bg: 'var(--orange-bg)' },
  { color: 'var(--red)',    bg: 'var(--red-bg)' },
  { color: 'var(--indigo)', bg: 'var(--purple-bg)' },
];
const taskFingerprintCache = new Map();

// Substring → label rules. The system prompt (lowercased) is matched
// against each ``needle`` in order; first hit wins. Each needle should be
// a phrase that ONLY the target agent emits — generic words like "bash"
// or "explore" appear in every CLI's tool descriptions and would
// false-positive everything else.
//
// Verified against real traces; add new entries with the same standard
// (cite the trace file you pulled the phrase from).
const TASK_LABEL_RULES = [
  // Specific sub-tasks first, so they win over the main-agent rule below.
  ['generate a concise, sentence-case title',     'Title gen'],   // Claude Code's session-title sub-call
  ['summarize the conversation so far',           'Summary'],     // Claude Code session summary
  ['context summarization assistant',             'Compact'],     // pi compaction sub-call

  // Main agents — anchored on a phrase verified against each CLI's real
  // system prompt (live trace or bundled source). iFlow's main prompt was
  // forked from Gemini's wording, so its rule must come BEFORE the Gemini
  // one ("interactive cli agent" vs "non-interactive cli agent").
  ["anthropic's claude agent sdk",                'Claude Code'], // "You are a Claude agent, built on Anthropic's Claude Agent SDK."
  ['cc_version=',                                 'Claude Code'], // x-anthropic-billing-header — only Claude Code emits it
  ['you are codex',                               'Codex'],       // "You are Codex, a coding agent based on GPT-5."
  ['you are iflow cli',                           'iFlow CLI'],   // "You are iFlow CLI, an interactive CLI agent..."
  ['non-interactive cli agent',                   'Gemini CLI'],  // "You are a non-interactive CLI agent specializing in..."
  ['you are opencode',                            'opencode'],    // "You are opencode, an agent - please keep going..."
  ['running inside openclaw',                     'OpenClaw'],    // "You are a personal assistant running inside OpenClaw."
  ['expert coding assistant operating inside pi', 'Pi'],          // "You are an expert coding assistant operating inside pi, a coding agent harness."
  ['you are kimi code cli',                       'Kimi'],        // "You are Kimi Code CLI, an interactive general AI agent..."
  ['you are hermes agent',                        'Hermes'],      // "You are Hermes Agent, an intelligent AI assistant created by Nous Research."
  ['you are devin',                               'Devin'],       // "You are Devin, a powerful agentic AI coding assistant created by Cognition."
  ['for qoder, an ai coding assistant',           'Qoder'],       // "You are an agent for Qoder, an AI coding assistant."
];

function getTaskFingerprint(e) {
  const rid = e.request_id;
  if (taskFingerprintCache.has(rid)) return taskFingerprintCache.get(rid);
  const body = e.request?.body;
  if (!body) { taskFingerprintCache.set(rid, null); return null; }

  // Pull the system prompt out of whichever shape the upstream uses.
  // Anthropic: body.system (string or text-block array)
  // OpenAI Responses: body.instructions OR body.input[]/role:system (opencode)
  // OpenAI Chat Completions: body.messages[]/role:system (iflow, kimi, …)
  // Google Gemini: body.systemInstruction.parts[*].text
  let sysText = '';
  if (typeof body.system === 'string') sysText = body.system;
  else if (Array.isArray(body.system)) sysText = body.system.map(s => typeof s === 'string' ? s : (s.text || '')).join('\n');
  else if (typeof body.instructions === 'string') sysText = body.instructions;
  else if (body.systemInstruction && Array.isArray(body.systemInstruction.parts)) {
    sysText = body.systemInstruction.parts.map(p => p?.text || '').join('\n');
  } else {
    for (const key of ['input', 'messages']) {
      const arr = body[key];
      if (!Array.isArray(arr)) continue;
      for (const m of arr) {
        if (m && typeof m === 'object' && m.role === 'system') {
          const c = m.content;
          if (typeof c === 'string') { sysText = c; break; }
          if (Array.isArray(c)) {
            sysText = c.map(b => (typeof b === 'string' ? b : (b?.text || ''))).join('\n');
            break;
          }
        }
      }
      if (sysText) break;
    }
  }

  // Stable fingerprint: full system + sorted tool names.
  const tools = getTools(body);
  const toolKey = tools.map(getToolName).sort().join(',');
  const fp = sysText + '|' + toolKey;

  // Friendly short label: substring rule, else first non-empty line, else tool count.
  const lower = sysText.toLowerCase();
  let label = '';
  if (!sysText && !tools.length) label = t('task_simple');
  else {
    const rule = TASK_LABEL_RULES.find(([needle]) => lower.includes(needle));
    if (rule) label = rule[1];
    else if (sysText) {
      const firstLine = sysText.split('\n').find(l => l.trim()) || '';
      label = firstLine.slice(0, 20).trim() || (tools.length + ' tools');
    } else label = tools.length + ' tools';
  }

  const result = { fp, label };
  taskFingerprintCache.set(rid, result);
  return result;
}

function getTaskColor(fp) {
  if (!fp) return TASK_COLORS[0];
  // Hash with sampling for long strings (system prompts can be very large)
  let hash = 0;
  const step = fp.length > 1000 ? Math.floor(fp.length / 500) : 1;
  for (let i = 0; i < fp.length; i += step) hash = ((hash << 5) - hash + fp.charCodeAt(i)) | 0;
  hash = ((hash << 5) - hash + fp.length) | 0; // include length for extra differentiation
  return TASK_COLORS[Math.abs(hash) % TASK_COLORS.length];
}

function createSidebarItem(e, i) {
  const item = document.createElement('div');
  const statusCode = getResponseStatus(e);
  const failed = statusCode >= 400;
  item.className = 'sidebar-item' + (failed ? ' is-error' : '');
  item.dataset.idx = i;
  // Make the row keyboard-accessible — div+click was inert to Tab/Enter.
  item.setAttribute('role', 'button');
  item.tabIndex = 0;
  const u = getUsage(e);
  const inTok = u?.input_tokens || 0, outTok = u?.output_tokens || 0;
  const model = e.request?.body?.model || '';
  const shortModel = model.replace(/^claude-/, '').replace(/-\d{8}$/, '');
  const badge = modelBadge(model);
  // Format with 24h for non-English locales (the AM/PM the platform default
  // gives is jarring in zh/ja/ko/de/fr/ru/ar locales).
  const _timeOpts = currentLang.startsWith('en') ? undefined : { hour12: false };
  const timeStr = e.timestamp ? new Date(e.timestamp).toLocaleTimeString(currentLang, _timeOpts) : '';
  // Hover tooltip: full local timestamp + human-relative gap. The wall-clock
  // alone is useless when scanning a fast session — every entry shows the
  // same minute. The relative form ("3m ago") gives the actual gap.
  const timeTip = e.timestamp ? new Date(e.timestamp).toLocaleString() + ' · ' + relativeTimeFromNow(e.timestamp) : '';
  // Task type coloring
  const taskInfo = getTaskFingerprint(e);
  const taskColor = taskInfo ? getTaskColor(taskInfo.fp) : TASK_COLORS[0];
  item.style.borderLeftColor = failed ? 'var(--red)' : taskColor.color;
  const taskBadgeHtml = taskInfo && taskInfo.label ? `<span class="si-task" style="background:${taskColor.bg};color:${taskColor.color}" title="${esc(taskInfo.label)}">${esc(taskInfo.label)}</span>` : '';
  const errorDot = failed ? `<span class="si-error-dot" title="HTTP ${statusCode}"></span>` : '';
  item.innerHTML = `
    <div class="si-row1">
      <span class="si-turn-wrap"><span class="si-turn">${t('turn')} ${e.turn || '?'}</span>${errorDot}</span>
      ${taskBadgeHtml}
      <span class="si-model" style="background:${badge.bg};color:${badge.fg}">${esc(shortModel)}</span>
    </div>
    <div class="si-row2">
      <span class="si-tok">${(inTok + outTok).toLocaleString()} ${t('tok')}</span>
      <span class="si-dur">${fmtDuration(e.duration_ms || 0)}</span>
      <span class="si-time" title="${esc(timeTip)}">${esc(timeStr)}</span>
    </div>
    <div class="si-path">${esc((e.request?.method || '') + ' ' + (e.request?.path || '').replace(/^\/{2,}/, '/'))}</div>`;
  item.onclick = () => selectEntry(i);
  item.onkeydown = (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectEntry(i); }
  };
  return item;
}

function renderSidebar(preserveDetail) {
  const sb = $('#sidebar');
  const prevScrollTop = sb.scrollTop;

  // Use virtual scroll for large filtered sets
  if (filtered.length > LAZY_THRESHOLD) {
    virtualMode = true;
    sb.classList.add('virtual-scroll');
    vsFilteredItems = filtered.map((e, i) => ({ entry: e, idx: i }));
    visualOrder = vsFilteredItems.map(item => item.idx);
    vsInitSidebar(sb, prevScrollTop, preserveDetail);
    return;
  }

  // Standard DOM-based sidebar for small traces
  virtualMode = false;
  sb.classList.remove('virtual-scroll');
  sb.innerHTML = '';
  const groups = new Map();
  filtered.forEach((e, i) => {
    // Records without a model field are housekeeping calls (e.g.
    // GET /v1/models, /api/codex/apps). Bucket them as "Internal" so the
    // sidebar isn't littered with "UNKNOWN".
    const model = e.request?.body?.model || '__internal__';
    if (!groups.has(model)) groups.set(model, []);
    groups.get(model).push({ entry: e, idx: i });
  });
  const sorted = [...groups.keys()].sort((a, b) => {
    const pa = modelPriority(a), pb = modelPriority(b);
    return pa !== pb ? pa - pb : a.localeCompare(b);
  });
  if (sorted.length <= 1) {
    // Insert time gap indicators between entries
    let lastTs = null;
    filtered.forEach((e, i) => {
      const gap = _timeGapHtml(e, lastTs);
      if (gap) sb.insertAdjacentHTML('beforeend', gap);
      lastTs = e.timestamp ? new Date(e.timestamp).getTime() : null;
      sb.appendChild(createSidebarItem(e, i));
    });
  } else {
    sorted.forEach(model => {
      const items = groups.get(model);
      const isInternal = model === '__internal__';
      const shortModel = isInternal ? t('group_internal') : model.replace(/^claude-/, '').replace(/-\d{8}$/, '');
      const color = isInternal ? 'var(--text-tertiary)' : modelColor(model);
      const isCollapsed = collapsedGroups.has(model);
      const header = document.createElement('div');
      header.className = 'sidebar-group-header' + (isInternal ? ' is-internal' : '');
      header.innerHTML = `<span class="group-dot" style="background:${color}"></span><span class="group-name">${esc(shortModel)}</span><span class="group-count">${items.length}</span><span class="group-chevron${isCollapsed ? '' : ' open'}">&#9654;</span>`;
      const content = document.createElement('div');
      if (isCollapsed) content.style.display = 'none';
      items.forEach(({ entry: e, idx: i }) => content.appendChild(createSidebarItem(e, i)));
      header.onclick = () => {
        const nowCollapsed = content.style.display !== 'none';
        content.style.display = nowCollapsed ? 'none' : '';
        header.querySelector('.group-chevron').classList.toggle('open');
        if (nowCollapsed) collapsedGroups.add(model); else collapsedGroups.delete(model);
        buildVisualOrder();
        updateMobileNav();
      };
      sb.appendChild(header);
      sb.appendChild(content);
    });
  }
  buildVisualOrder();
  _restoreSelection(preserveDetail);
  if (preserveDetail) sb.scrollTop = prevScrollTop;
}

function _restoreSelection(preserveDetail) {
  let restoredIdx = -1;
  if (preserveDetail && currentDetailRequestId) {
    restoredIdx = filtered.findIndex(e => e.request_id === currentDetailRequestId);
  }
  if (restoredIdx >= 0) {
    selectEntry(restoredIdx, { force: false });
  } else if (activeIdx >= 0 && activeIdx < filtered.length) {
    selectEntry(activeIdx, { force: !preserveDetail });
  } else if (filtered.length) {
    let defaultIdx = 0;
    for (let i = 0; i < filtered.length; i++) {
      const m = (filtered[i].request?.body?.model || '').toLowerCase();
      if (m.includes('opus') || m.includes('sonnet')) { defaultIdx = i; break; }
    }
    selectEntry(defaultIdx);
  } else {
    activeIdx = -1; $('#detail').innerHTML = `<div class="empty-state">${t('empty_state')}</div>`;
  }
}

/* ─── Time gap indicator ─── */
function _timeGapHtml(entry, lastTs) {
  if (!lastTs || !entry.timestamp) return '';
  const ts = new Date(entry.timestamp).getTime();
  const gapMs = ts - lastTs;
  if (gapMs < 60000) return ''; // less than 1 min
  let label;
  if (gapMs < 3600000) label = Math.round(gapMs / 60000) + ' min gap';
  else label = (gapMs / 3600000).toFixed(1) + ' hr gap';
  return `<div class="time-gap"><span class="tg-line"></span>${label}<span class="tg-line"></span></div>`;
}

/* ─── Position indicator ─── */
function updatePositionIndicator() {
  const pi = $('#position-indicator');
  if (!pi) return;
  if (!filtered.length || activeIdx < 0) {
    pi.style.display = 'none';
    return;
  }
  pi.style.display = 'flex';
  const entry = filtered[activeIdx];
  const turnNum = entry.turn || (activeIdx + 1);
  const pos = activeIdx + 1;
  const total = filtered.length;
  const pct = total > 1 ? ((pos - 1) / (total - 1)) * 100 : 0;
  $('#pi-current').textContent = turnNum;
  // Update only the count — the "of" label is a separate i18n-aware span.
  const countEl = document.getElementById('pi-total-count');
  if (countEl) countEl.textContent = total;
  $('#pi-fill').style.width = pct + '%';
}

/* ─── Virtual scroll ─── */
let _vsRafPending = false;

function vsInitSidebar(sb, prevScrollTop, preserveDetail) {
  sb.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'vs-spacer';
  spacer.style.height = (vsFilteredItems.length * VS_ITEM_HEIGHT) + 'px';
  sb.appendChild(spacer);

  // Throttled scroll handler
  sb.onscroll = () => {
    if (!_vsRafPending) {
      _vsRafPending = true;
      requestAnimationFrame(() => {
        _vsRafPending = false;
        vsRenderVisible();
      });
    }
  };

  if (preserveDetail) sb.scrollTop = prevScrollTop;
  vsRenderVisible();
  _restoreSelection(preserveDetail);
}

function vsRenderVisible() {
  const sb = $('#sidebar');
  if (!sb) return;
  const spacer = sb.querySelector('.vs-spacer');
  if (!spacer) return;

  const scrollTop = sb.scrollTop;
  const viewHeight = sb.clientHeight;
  const startIdx = Math.max(0, Math.floor(scrollTop / VS_ITEM_HEIGHT) - VS_BUFFER);
  const endIdx = Math.min(vsFilteredItems.length, Math.ceil((scrollTop + viewHeight) / VS_ITEM_HEIGHT) + VS_BUFFER);

  // Collect existing rendered items
  const existing = new Map();
  spacer.querySelectorAll('.sidebar-item').forEach(el => {
    existing.set(parseInt(el.dataset.idx), el);
  });

  const needed = new Set();
  for (let i = startIdx; i < endIdx; i++) {
    needed.add(vsFilteredItems[i].idx);
  }

  // Remove items no longer visible
  existing.forEach((el, idx) => {
    if (!needed.has(idx)) el.remove();
  });

  // Add missing items
  for (let i = startIdx; i < endIdx; i++) {
    const { entry, idx } = vsFilteredItems[i];
    if (existing.has(idx)) {
      // Update active state
      existing.get(idx).classList.toggle('active', idx === activeIdx);
      continue;
    }
    const item = createSidebarItem(entry, idx);
    item.style.position = 'absolute';
    item.style.top = (i * VS_ITEM_HEIGHT) + 'px';
    item.style.height = VS_ITEM_HEIGHT + 'px';
    item.classList.toggle('active', idx === activeIdx);
    spacer.appendChild(item);
  }
}

function vsScrollToIdx(idx) {
  const sb = $('#sidebar');
  if (!sb || !virtualMode) return;
  const pos = vsFilteredItems.findIndex(item => item.idx === idx);
  if (pos < 0) return;
  const itemTop = pos * VS_ITEM_HEIGHT;
  const itemBottom = itemTop + VS_ITEM_HEIGHT;
  if (itemTop < sb.scrollTop) {
    sb.scrollTop = itemTop;
  } else if (itemBottom > sb.scrollTop + sb.clientHeight) {
    sb.scrollTop = itemBottom - sb.clientHeight;
  }
}

function selectEntry(idx, opts) {
  if (idx < 0 || idx >= filtered.length) return;
  const force = !opts || opts.force !== false;
  activeIdx = idx;
  // Reflect the active turn in the URL hash so the page is shareable /
  // bookmarkable. replaceState avoids polluting the back-button stack.
  const turn = filtered[idx]?.turn;
  if (turn != null) {
    const want = `#turn=${turn}`;
    if (location.hash !== want) {
      try { history.replaceState(null, '', want); } catch (_) {}
    }
  }
  if (virtualMode) {
    vsRenderVisible();
  } else {
    // O(1) toggle instead of querySelectorAll(.sidebar-item) — gets
    // expensive when arrow-keying through traces with hundreds of items.
    const sb = document.getElementById('sidebar');
    if (sb) {
      const prev = sb.querySelector('.sidebar-item.active');
      if (prev) prev.classList.remove('active');
      const next = sb.querySelector(`.sidebar-item[data-idx="${idx}"]`);
      if (next) next.classList.add('active');
    }
  }
  // Skip re-render if same entry and force=false (preserves scroll position in live mode)
  if (!force && currentDetailRequestId === filtered[idx].request_id) {
    // Just update sidebar highlight, keep detail as-is
  } else {
    const entry = filtered[idx];
    const resolved = entry._isStub ? getFullEntry(entry) : entry;
    renderDetail(resolved);
  }
  if (virtualMode) {
    vsScrollToIdx(idx);
  } else {
    const active = document.querySelector('.sidebar-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  updatePositionIndicator();
  mobileShowDetail();
  updateMobileNav();
}

/* ─── Detail ─── */
// Persist section collapse state across turn switches.
// Key: section title text, Value: true = open, false = collapsed.
const sectionCollapseState = {};

function saveSectionStates() {
  const d = $('#detail');
  if (!d) return;
  d.querySelectorAll('.section').forEach(sec => {
    const titleEl = sec.querySelector('.section-header .title');
    const bodyEl = sec.querySelector('.section-body');
    if (titleEl && bodyEl) {
      sectionCollapseState[titleEl.textContent] = bodyEl.classList.contains('open');
    }
  });
}

function restoreSectionStates() {
  const d = $('#detail');
  if (!d) return;
  d.querySelectorAll('.section').forEach(sec => {
    const titleEl = sec.querySelector('.section-header .title');
    const bodyEl = sec.querySelector('.section-body');
    const chevron = sec.querySelector('.chevron');
    if (!titleEl || !bodyEl || !chevron) return;
    const key = titleEl.textContent;
    if (key in sectionCollapseState) {
      const shouldBeOpen = sectionCollapseState[key];
      if (shouldBeOpen && !bodyEl.classList.contains('open')) {
        bodyEl.classList.add('open');
        chevron.classList.add('open');
      } else if (!shouldBeOpen && bodyEl.classList.contains('open')) {
        bodyEl.classList.remove('open');
        chevron.classList.remove('open');
      }
    }
  });
}

function renderDetail(e) {
  saveSectionStates();
  currentDetailRequestId = e.request_id;
  const d = $('#detail');
  const reqBody = e.request?.body, respBody = e.response?.body, usage = getUsage(e);
  const statusCode = getResponseStatus(e);
  const isError = statusCode >= 400;
  const errorMessage = getResponseErrorMessage(e);
  let html = '';

  if (isError) {
    html += `<div class="error-banner"><div class="eb-icon">&#9888;</div><div class="eb-content"><div class="eb-title">HTTP ${statusCode}</div><div class="eb-message">${esc(errorMessage)}</div></div></div>`;
  }

  // Action bar — buttons on the left, per-turn token chips on the right.
  html += `<div class="action-bar">
    <button class="act-btn" title="${t('tip_request_json')}" onclick="copyRequestBody(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>${t('btn_request_json')}</button>
    <button class="act-btn" title="${t('tip_curl')}" onclick="copyCurl(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>${t('btn_curl')}</button>
    <button class="act-btn" title="${t('tip_diff_prev')}" onclick="showDiff(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/><path d="M3 6h18M3 18h18" opacity=".4"/></svg>${t('btn_diff')}</button>
    <button class="act-btn" title="${t('copy_response_text')}" onclick="copyResponseText(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 001 1h4"/><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z"/></svg>${t('copy_response_text') || 'Copy text'}</button>
    <button class="act-btn" title="${t('expand_all')}" onclick="toggleAllSections(this, true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>${t('expand_all') || 'Expand'}</button>
    <button class="act-btn" title="${t('collapse_all')}" onclick="toggleAllSections(this, false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>${t('collapse_all') || 'Collapse'}</button>
    ${usage ? renderTokenChips(usage) : ''}
  </div>`;

  const tools = getTools(reqBody);
  if (tools.length) html += section(t('section_tools'), renderTools(tools), false, null, tools.length + ' ' + t('badge_tools'));

  const sysPrompt = extractSystem(reqBody);
  if (sysPrompt) {
    const sysHostId = 'mdh-' + Math.random().toString(36).slice(2, 9);
    html += section(
      t('section_system'),
      renderSystemPromptBody(sysPrompt, sysHostId),
      true,
      sysPrompt,
      null,
      renderSystemPromptControls(sysHostId)
    );
  }

  const msgs = getMessages(reqBody);
  if (msgs && msgs.length) html += section(t('section_messages'), renderMessages(msgs), true, null, msgs.length + ' ' + t('badge_messages'));

  const respOutput = getResponseOutput(e);
  if (respOutput?.content) html += section(t('section_response'), renderResponseContent(respOutput), true);

  const streamEvents = getResponseEvents(e);
  if (streamEvents.length) html += section(t('section_sse'), renderSSEEvents(streamEvents), false, null, streamEvents.length + ' ' + t('badge_events'));

  const jsonHostId = 'jh-' + Math.random().toString(36).slice(2, 9);
  html += section(
    t('section_json'),
    renderJsonHost(e, jsonHostId),
    false,
    JSON.stringify(e, null, 2),
    null,
    renderJsonControls(jsonHostId)
  );

  d.innerHTML = html;
  bindSections(d);
  restoreSectionStates();
  initStickyHeaders(d);
  if (globalSearchState.open && globalSearchState.query) {
    const target = getTargetForGlobalMatch(globalSearchState.currentMatch);
    const localIndex = target && target.requestId === e.request_id ? target.localIndex : 0;
    applyGlobalSearchHighlights(localIndex);
  }
}

/* ─── Renderers ─── */
function extractSystem(body) {
  if (!body) return null;
  // Anthropic: body.system (string or text-block array)
  if (typeof body.system === 'string') return body.system;
  if (Array.isArray(body.system)) return body.system.map(b => typeof b === 'string' ? b : b.type === 'text' ? (b.text || '') : JSON.stringify(b)).join('\n\n');
  // OpenAI Responses: body.instructions (codex) OR a system-role item in
  // body.input[] (opencode). We have to scan input[] explicitly because
  // some clients put their full system prompt there instead of using the
  // top-level instructions field.
  if (typeof body.instructions === 'string') return body.instructions;
  // Gemini: body.systemInstruction is { parts: [ { text } ] } (single-message form).
  if (body.systemInstruction && Array.isArray(body.systemInstruction.parts)) {
    return body.systemInstruction.parts.map(p => p?.text || '').filter(Boolean).join('\n\n') || null;
  }
  // Fallback: scan body.input[] (OpenAI Responses) and body.messages[]
  // (OpenAI Chat Completions, used by iflow/kimi) for a role:"system"
  // item. Picks the first matching item — that's the canonical system
  // prompt for these schemas.
  for (const key of ['input', 'messages']) {
    const arr = body[key];
    if (!Array.isArray(arr)) continue;
    for (const m of arr) {
      if (m && typeof m === 'object' && m.role === 'system') {
        const c = m.content;
        if (typeof c === 'string') return c;
        if (Array.isArray(c)) {
          return c.map(b => typeof b === 'string' ? b : (b?.text || '')).filter(Boolean).join('\n');
        }
      }
    }
  }
  return null;
}

function getResponseEvents(entry) {
  const sse = entry?.response?.sse_events;
  if (Array.isArray(sse) && sse.length > 0) return sse;
  const ws = entry?.response?.ws_events;
  return Array.isArray(ws) ? ws : [];
}

function getEventType(event) {
  if (!event || typeof event !== 'object') return '';
  return typeof event.event === 'string' ? event.event : (typeof event.type === 'string' ? event.type : '');
}

function getEventData(event) {
  if (!event || typeof event !== 'object') return null;
  let data = Object.prototype.hasOwnProperty.call(event, 'data') ? event.data : event;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch(e) { return null; }
  }
  return data && typeof data === 'object' ? data : null;
}

// Normalize messages across all three upstreams:
//   Anthropic        body.messages   ([{role, content}])
//   OpenAI Responses body.input      (mixed message / reasoning / tool items)
//   Google Gemini    body.contents   ([{role, parts: [{text|functionCall|…}]}])
// All paths produce the {role, content: [content-block, …]} shape that
// renderContent understands.
function getMessages(body) {
  if (!body) return [];
  // Filter out role:'system' items — those are surfaced in the
  // dedicated System Prompt section by extractSystem(), so leaving
  // them in here would render the prompt twice.
  if (Array.isArray(body.messages) && body.messages.length > 0) {
    return body.messages.filter(m => !m || m.role !== 'system');
  }
  if (Array.isArray(body.contents)) return body.contents.map(geminiContentToMessage).filter(Boolean);
  if (!Array.isArray(body.input)) return [];

  const out = [];
  for (const item of body.input) {
    if (!item || typeof item !== 'object') continue;
    if (item.role === 'system') continue;  // surfaced by extractSystem
    const t = item.type;
    if (t === 'additional_tools') continue;
    const normalized = normalizeOpenAIItem(item);
    if (normalized) out.push(normalized);
  }
  return out;
}

function normalizeOpenAIContent(content) {
  const blocks = Array.isArray(content) ? content : [content];
  return blocks.filter(block => block !== null && block !== undefined).map(block => {
    if (typeof block === 'string') return { type: 'text', text: block };
    if (!block || typeof block !== 'object') return { type: 'raw_item', item_type: typeof block, item: block };
    if (block.type === 'input_text' || block.type === 'output_text' || block.type === 'text') {
      return { type: 'text', text: block.text || '' };
    }
    return block;
  });
}

function parseOpenAIToolArguments(value) {
  if (typeof value !== 'string') return value ?? {};
  try { return JSON.parse(value); } catch (_) { return value; }
}

function normalizeOpenAIItem(item) {
  if (!item || typeof item !== 'object') return null;
  const itemType = typeof item.type === 'string' ? item.type : '';

  if (itemType === 'message' || (!itemType && typeof item.role === 'string')) {
    return { role: item.role || 'unknown', content: normalizeOpenAIContent(item.content) };
  }

  if (itemType === 'reasoning') {
    const summary = item.summary;
    const text = Array.isArray(summary)
      ? summary.map(part => part?.text || '').join('\n')
      : (summary?.text || '');
    if (text.trim()) {
      return { role: 'assistant', content: [{ type: 'thinking', thinking: text }] };
    }
  }

  if (itemType.endsWith('_call_output')) {
    const isSimpleOutput = itemType === 'function_call_output' || itemType === 'custom_tool_call_output';
    return {
      role: 'tool',
      content: [{
        type: 'tool_result',
        tool_use_id: item.call_id || item.id,
        id: item.id,
        call_id: item.call_id,
        status: item.status,
        item_type: itemType,
        content: isSimpleOutput && Object.prototype.hasOwnProperty.call(item, 'output') ? item.output : item,
      }],
    };
  }

  if (itemType.endsWith('_call')) {
    let input = item;
    if (itemType === 'custom_tool_call') input = item.input ?? '';
    else if (itemType === 'function_call') input = parseOpenAIToolArguments(item.arguments);
    return {
      role: 'assistant',
      content: [{
        type: 'tool_use',
        id: item.id || item.call_id,
        call_id: item.call_id,
        name: item.name || itemType.slice(0, -5),
        status: item.status,
        item_type: itemType,
        input,
      }],
    };
  }

  // Responses evolves frequently. Preserve every unrecognized item in the
  // readable view instead of requiring users to discover it in Raw JSON.
  return {
    role: typeof item.role === 'string' && item.role ? item.role : 'unknown',
    content: [{ type: 'raw_item', item_type: itemType || 'unknown', item }],
  };
}

function getTools(body) {
  if (!body || typeof body !== 'object') return [];
  const tools = Array.isArray(body.tools) ? [...body.tools] : [];
  if (Array.isArray(body.input)) {
    body.input.forEach(item => {
      if (item?.type === 'additional_tools' && Array.isArray(item.tools)) tools.push(...item.tools);
    });
  }
  return tools.filter(tool => tool && typeof tool === 'object');
}

function getToolName(tool) {
  return tool?.name || tool?.function?.name || tool?.type || '';
}

// Convert one Gemini ``contents[]`` item into our {role, content[]} shape.
function geminiContentToMessage(item) {
  if (!item || typeof item !== 'object') return null;
  const role = item.role === 'model' ? 'assistant' : (item.role || 'user');
  const parts = Array.isArray(item.parts) ? item.parts : [];
  const blocks = [];
  for (const p of parts) {
    if (!p || typeof p !== 'object') continue;
    if (typeof p.text === 'string') {
      if (p.thought) blocks.push({ type: 'thinking', thinking: p.text });
      else blocks.push({ type: 'text', text: p.text });
    } else if (p.functionCall) {
      blocks.push({ type: 'tool_use', name: p.functionCall.name, input: p.functionCall.args || {} });
    } else if (p.functionResponse) {
      blocks.push({ type: 'tool_result', tool_use_id: p.functionResponse.name, content: p.functionResponse.response });
    } else if (p.inlineData) {
      blocks.push({ type: 'image', source: { type: 'base64', media_type: p.inlineData.mimeType, data: p.inlineData.data } });
    }
  }
  return blocks.length ? { role, content: blocks } : null;
}

// Extract token usage. Each upstream uses a different field name; we
// translate to the {input_tokens, output_tokens, cache_read_input_tokens,
// cache_creation_input_tokens} shape that ``renderTokenChips`` expects.
function getUsage(entry) {
  const body = entry?.response?.body;
  if (body?.usage) return body.usage;
  // Gemini: response.usageMetadata { promptTokenCount, candidatesTokenCount, cachedContentTokenCount }
  const meta = body?.usageMetadata;
  if (meta) {
    return {
      input_tokens: meta.promptTokenCount || 0,
      output_tokens: meta.candidatesTokenCount || 0,
      cache_read_input_tokens: meta.cachedContentTokenCount || 0,
    };
  }
  // OpenAI Responses fallback: scan SSE events for response.completed.usage
  const events = getResponseEvents(entry);
  for (let i = events.length - 1; i >= 0; i--) {
    if (getEventType(events[i]) !== 'response.completed') continue;
    const data = getEventData(events[i]);
    if (data?.response?.usage) return data.response.usage;
  }
  return null;
}

function normalizeResponseOutput(output) {
  if (!Array.isArray(output) || output.length === 0) return null;
  const content = [];
  for (const item of output) {
    const normalized = normalizeOpenAIItem(item);
    if (normalized && Array.isArray(normalized.content)) content.push(...normalized.content);
  }
  return content.length > 0 ? { content } : null;
}

// Extract response output from response.body.content or SSE response.completed event
function getResponseOutput(entry) {
  const body = entry?.response?.body;
  if (body?.content) return body;
  const fromBody = normalizeResponseOutput(body?.output);
  if (fromBody) return fromBody;
  const events = getResponseEvents(entry);
  for (let i = events.length - 1; i >= 0; i--) {
    if (getEventType(events[i]) !== 'response.completed') continue;
    const data = getEventData(events[i]);
    const normalized = normalizeResponseOutput(data?.response?.output);
    if (normalized) return normalized;
  }
  const streamedItems = [];
  for (const event of events) {
    if (getEventType(event) !== 'response.output_item.done') continue;
    const item = getEventData(event)?.item;
    if (item && typeof item === 'object') streamedItems.push(item);
  }
  const fromItems = normalizeResponseOutput(streamedItems);
  if (fromItems) return fromItems;
  return null;
}
// System Prompt is split into a body (the two views) and a small set of
// header controls (the Raw / Markdown toggle). The controls live in the
// section-header (compact, right-aligned) instead of stealing a row at
// the top of the body.
function renderSystemPromptBody(text, hostId) {
  return (
    `<div class="md-host" data-mode="raw" id="${hostId}">` +
      `<div class="md-view md-view-raw"><div class="pre-text">${esc(text)}</div></div>` +
      `<div class="md-view md-view-md">${renderMarkdown(text)}</div>` +
    `</div>`
  );
}
function renderSystemPromptControls(hostId) {
  return (
    `<div class="md-toggle" onclick="event.stopPropagation()">` +
      `<button class="md-tab active" data-md-host="${hostId}" data-md-mode="raw" onclick="setMdMode('${hostId}','raw')">${t('view_raw')}</button>` +
      `<button class="md-tab" data-md-host="${hostId}" data-md-mode="md" onclick="setMdMode('${hostId}','md')">${t('view_md')}</button>` +
    `</div>`
  );
}

// The .md-host (body) and the .md-tab buttons (section header) live in
// different DOM subtrees, so we look the tabs up by data-md-host attr
// rather than walking down from the host. Matching by dataset.mdMode also
// avoids the brittle textContent comparison that broke with translations.
function setMdMode(hostId, mode) {
  const host = document.getElementById(hostId);
  if (host) host.dataset.mode = mode;
  document.querySelectorAll(`.md-tab[data-md-host="${hostId}"]`).forEach(b => {
    b.classList.toggle('active', b.dataset.mdMode === mode);
  });
}

// Render markdown via the bundled marked.js (handles tables / strikethrough /
// autolinks / fenced code with language hints / GFM in general). Falls back
// to a <pre> dump if marked failed to load.
let _markedConfigured = false;
function renderMarkdown(text) {
  if (!text) return '';
  if (typeof marked === 'undefined') return `<div class="md-body"><pre>${esc(text)}</pre></div>`;
  if (!_markedConfigured) {
    // Open all rendered links in a new tab, with safe rel. Reject
    // ``javascript:`` / ``data:`` / ``vbscript:`` schemes that would let a
    // crafted prompt execute when the user clicked a "link" — the trace can
    // contain arbitrary text that originated from the model.
    const _safeHref = (href) => {
      const s = String(href || '').trim();
      if (/^(javascript|data|vbscript|file):/i.test(s)) return '#';
      return s;
    };
    marked.use({
      renderer: {
        link({ href, title, text: t }) {
          const tt = title ? ` title="${String(title).replace(/"/g, '&quot;')}"` : '';
          const safe = _safeHref(href).replace(/"/g, '&quot;');
          return `<a href="${safe}" target="_blank" rel="noopener noreferrer"${tt}>${t}</a>`;
        },
      },
    });
    _markedConfigured = true;
  }
  const html = marked.parse(text, { gfm: true, breaks: false });
  return `<div class="md-body">${html}</div>`;
}

function renderMessages(msgs) {
  return msgs.map(m => {
    const role = m.role || 'unknown';
    const cls = roleClass(role);
    return `<div class="msg ${cls}"><div class="msg-role">${esc(role)}</div>${renderContent(m.content, role)}</div>`;
  }).join('');
}

function renderContentMeta(block) {
  const values = [];
  if (block.item_type) values.push(block.item_type);
  if (block.status) values.push(block.status);
  if (block.call_id) values.push('call_id: ' + block.call_id);
  if (block.id && block.id !== block.call_id) values.push('id: ' + block.id);
  return values.length ? `<div class="content-meta">${values.map(esc).join(' · ')}</div>` : '';
}

function renderContent(content, role) {
  if (typeof content === 'string') return `<div class="content-block">${esc(content)}</div>`;
  if (!Array.isArray(content)) return `<pre>${esc(JSON.stringify(content, null, 2))}</pre>`;
  return content.map(block => {
    if (!block || typeof block !== 'object') return `<div class="content-block"><pre>${esc(JSON.stringify(block, null, 2))}</pre></div>`;
    if (block.type === 'text' || block.type === 'input_text' || block.type === 'output_text') { const txt = block.text || ''; if (!txt.trim()) return ''; return `<div class="content-block">${esc(txt)}</div>`; }
    if (block.type === 'thinking') {
      const thinking = block.thinking || '';
      if (!thinking.trim()) return '';
      return `<div class="content-block"><span class="thinking-label">thinking</span><div class="pre-text">${esc(thinking)}</div></div>`;
    }
    if (block.type === 'tool_use') {
      const input = typeof block.input === 'string'
        ? `<div class="pre-text">${esc(block.input || '""')}</div>`
        : `<pre>${esc(JSON.stringify(block.input, null, 2))}</pre>`;
      return `<div class="content-block"><span class="tool-use-label">${esc(block.name || 'tool_use')}</span>${renderContentMeta(block)}${input}</div>`;
    }
    if (block.type === 'tool_result') {
      const rc = block.content;
      const label = `<span class="tool-use-label">result (${esc(block.tool_use_id || '')})</span>${renderContentMeta(block)}`;
      if (typeof rc === 'string') return `<div class="content-block">${label}<div class="pre-text">${esc(rc)}</div></div>`;
      if (Array.isArray(rc)) {
        const parts = rc.map(c => {
          if (typeof c === 'string') return `<div class="pre-text">${esc(c)}</div>`;
          if (!c || typeof c !== 'object') return `<pre>${esc(JSON.stringify(c))}</pre>`;
          if (c.type === 'text' || c.type === 'input_text' || c.type === 'output_text') return `<div class="pre-text">${esc(c.text || '')}</div>`;
          if (c.type === 'image') {
            const s = c.source || {};
            if (s.type === 'base64' && s.data) return `<img src="data:${esc(s.media_type || 'image/png')};base64,${s.data}" style="max-width:100%;border-radius:6px;border:1px solid var(--border);" />`;
            if (s.type === 'url' && s.url) return `<img src="${esc(s.url)}" style="max-width:100%;border-radius:6px;border:1px solid var(--border);" />`;
          }
          return `<pre>${esc(JSON.stringify(c))}</pre>`;
        }).join('');
        return `<div class="content-block">${label}${parts}</div>`;
      }
      return `<div class="content-block">${label}<pre>${esc(JSON.stringify(rc, null, 2))}</pre></div>`;
    }
    if (block.type === 'raw_item') return `<div class="content-block"><span class="tool-use-label">${esc(block.item_type || 'unknown')}</span><pre>${esc(JSON.stringify(block.item, null, 2))}</pre></div>`;
    if (block.type === 'image') {
      const src = block.source || {};
      if (src.type === 'base64' && src.data) {
        return `<div class="content-block"><img src="data:${esc(src.media_type || 'image/png')};base64,${src.data}" style="max-width:100%;border-radius:6px;border:1px solid var(--border);" /></div>`;
      }
      if (src.type === 'url' && src.url) {
        return `<div class="content-block"><img src="${esc(src.url)}" style="max-width:100%;border-radius:6px;border:1px solid var(--border);" /></div>`;
      }
      return `<div class="content-block"><em>[image: ${esc(src.media_type || 'unknown')}]</em></div>`;
    }
    return `<div class="content-block"><span class="tool-use-label">${esc(block.type || 'unknown')}</span><pre>${esc(JSON.stringify(block, null, 2))}</pre></div>`;
  }).join('');
}

function renderTools(tools) {
  const blocks = tools.map(td => {
    // OpenAI Responses API built-in tools (web_search / file_search /
    // code_interpreter / ...) identify by ``type`` and have no ``name``.
    const definition = td.function && typeof td.function === 'object' ? td.function : td;
    const name = getToolName(td) || 'unknown', desc = definition.description || td.description || '';
    const shortDesc = desc.split('\n')[0].substring(0, 120);
    const schema = definition.input_schema || definition.parameters || {};
    const props = schema.properties || {};
    const required = new Set(schema.required || []);
    const keys = Object.keys(props);
    let paramsHtml = '';
    if (keys.length) {
      paramsHtml = `<div class="tb-params-title">${t('params')}</div>` +
        keys.map(k => renderToolParam(k, props[k], required.has(k))).join('');
    }
    return `<div class="tool-block"><div class="tool-block-header"><span class="tb-arrow">&#9654;</span><span class="tb-name">${esc(name)}</span><span class="tb-desc">${esc(shortDesc)}</span></div><div class="tool-block-body">${desc ? `<div class="tb-full-desc">${esc(desc)}</div>` : ''}${paramsHtml}</div></div>`;
  }).join('');
  // Codex sessions ship 100+ tools — a substring filter on name/desc is
  // way more useful than scrolling. The row is sticky so the input
  // stays visible while the user scrolls through the matches.
  const filterRow = `<div class="tool-filter-row" onclick="event.stopPropagation()">` +
    `<input type="search" class="tool-filter-input" placeholder="${t('filter_tools_ph')}" oninput="filterToolList(this)" />` +
    `<span class="tool-filter-count" data-tool-count></span>` +
    `</div>`;
  return filterRow + blocks;
}

function filterToolList(input) {
  const q = (input.value || '').trim().toLowerCase();
  const root = input.closest('.section-body') || input.parentElement.parentElement;
  if (!root) return;
  const blocks = root.querySelectorAll('.tool-block');
  let shown = 0;
  blocks.forEach(b => {
    const name = (b.querySelector('.tb-name')?.textContent || '').toLowerCase();
    const desc = (b.querySelector('.tb-desc')?.textContent || '').toLowerCase();
    const match = !q || name.includes(q) || desc.includes(q);
    b.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  const count = root.querySelector('[data-tool-count]');
  if (count) count.textContent = q ? `${shown} / ${blocks.length}` : '';
}

// Recursive: param row + nested children for object.properties /
// array.items.properties. Also renders enum / default / format hints
// that the previous flat renderer dropped.
function renderToolParam(name, schema, isRequired, depth = 0) {
  if (!schema || typeof schema !== 'object') return '';
  if (depth > 6) return '';  // sanity cap on pathological schemas

  const typeLabel = formatSchemaType(schema);
  const desc = schema.description || '';
  const tags = [];
  if (typeLabel) tags.push(`<span class="tb-ptype">${esc(typeLabel)}</span>`);
  if (Array.isArray(schema.enum)) {
    const vals = schema.enum.map(v => (typeof v === 'string' ? v : JSON.stringify(v))).join(' | ');
    tags.push(`<span class="tb-penum" title="enum">${esc(vals)}</span>`);
  }
  if (schema.format) tags.push(`<span class="tb-pformat">${esc(schema.format)}</span>`);
  if (isRequired) tags.push(`<span class="tb-prequired">${t('required')}</span>`);
  if (schema.default !== undefined) {
    tags.push(`<span class="tb-pdefault">default: ${esc(JSON.stringify(schema.default))}</span>`);
  }

  const descLine = desc ? `<div class="tb-pdesc">${esc(desc)}</div>` : '';

  let nested = '';
  if (schema.type === 'object' && schema.properties && typeof schema.properties === 'object') {
    const innerReq = new Set(schema.required || []);
    const inner = Object.keys(schema.properties);
    if (inner.length) {
      nested = '<div class="tb-pchildren">' +
        inner.map(k => renderToolParam(k, schema.properties[k], innerReq.has(k), depth + 1)).join('') +
        '</div>';
    }
  } else if (schema.type === 'array' && schema.items && typeof schema.items === 'object') {
    const items = schema.items;
    if (items.type === 'object' && items.properties) {
      const innerReq = new Set(items.required || []);
      const inner = Object.keys(items.properties);
      nested = '<div class="tb-pchildren"><div class="tb-pchild-label">items</div>' +
        inner.map(k => renderToolParam(k, items.properties[k], innerReq.has(k), depth + 1)).join('') +
        '</div>';
    } else {
      const itemDesc = items.description ? `: ${esc(items.description)}` : '';
      nested = `<div class="tb-pchildren"><div class="tb-pchild-label">items ${esc(formatSchemaType(items))}${itemDesc}</div></div>`;
    }
  }

  return `<div class="tb-param"><div class="tb-param-row1"><span class="tb-pname">${esc(name)}</span>${tags.join('')}</div>${descLine}${nested}</div>`;
}

function formatSchemaType(schema) {
  if (!schema || typeof schema !== 'object') return '';
  if (Array.isArray(schema.type)) return schema.type.join(' | ');
  if (schema.type === 'array') {
    const inner = schema.items?.type;
    return inner ? `array<${Array.isArray(inner) ? inner.join('|') : inner}>` : 'array';
  }
  if (schema.type) return schema.type;
  if (Array.isArray(schema.enum)) return 'enum';
  if (schema.oneOf) return 'oneOf';
  if (schema.anyOf) return 'anyOf';
  return '';
}

function renderResponseContent(body) {
  if (!body.content) return `<em style="color:var(--text-tertiary)">${t('no_content')}</em>`;
  return renderContent(body.content, 'assistant');
}

// Compact token chips that live inside the action-bar (right-aligned).
// Hides zero-valued cache columns since they're often noise.
function renderTokenChips(u) {
  const items = [
    { label: t('tok_input'), val: u.input_tokens || 0, color: 'var(--blue)', hideIfZero: false },
    { label: t('tok_output'), val: u.output_tokens || 0, color: 'var(--green)', hideIfZero: false },
    { label: t('tok_cache_read'), val: u.cache_read_input_tokens || 0, color: 'var(--cyan)', hideIfZero: true },
    { label: t('tok_cache_create'), val: u.cache_creation_input_tokens || 0, color: 'var(--amber)', hideIfZero: true },
  ];
  const chips = items
    .filter(i => !i.hideIfZero || i.val > 0)
    .map(i =>
      `<span class="tok-chip" title="${esc(i.label)}"><span class="tok-dot" style="background:${i.color}"></span><span class="tok-val">${i.val.toLocaleString()}</span></span>`
    )
    .join('');
  return `<div class="tok-chips">${chips}</div>`;
}

function renderSSEEvents(events) {
  return events.map(e => {
    const eventType = getEventType(e) || 'event';
    const payload = Object.prototype.hasOwnProperty.call(e, 'data') ? e.data : e;
    const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
    const short = data.length > 200 ? data.substring(0, 200) + '...' : data;
    return `<div class="sse-event"><span class="sse-type">${esc(eventType)}</span><span class="sse-data">${esc(short)}</span></div>`;
  }).join('');
}
