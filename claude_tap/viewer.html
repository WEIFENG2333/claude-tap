<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Inspect AI CLI sessions, model calls, tool arguments, and responses.">
  <meta name="application-name" content="claude-tap">
  <meta name="theme-color" content="#f9fafb">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23101115' fill-rule='evenodd' d='M12.337 1.536l-.406 2.896h2.878v1.365H11.74l-.544 3.882h3.088v1.365h-3.278l-.507 3.609-1.35-.189.478-3.42H5.759l-.506 3.609-1.351-.189.479-3.42h-2.69V9.679h2.88l.543-3.882H2.216V4.432h3.09l.431-3.085 1.353.189-.406 2.896h3.869l.431-3.085 1.353.189ZM5.949 9.679h3.869l.543-3.882H6.494l-.545 3.882Z'/%3E%3C/svg%3E">
  <title>claude-tap</title>
  <!-- claude-tap:styles -->
</head>
<body>
  <main class="app-shell" id="workspace" data-sidebar="open" data-inspector="closed">
    <button class="mobile-scrim" id="mobile-scrim" type="button" aria-label="Close panel" tabindex="-1"></button>

    <div class="sidebar-column" id="sidebar-column">
      <aside class="session-panel quiet-bars" id="session-panel" aria-label="Session browser">
        <div class="brand-row">
          <div class="brand-lockup sidebar-wide" id="brand-lockup" aria-label="claude-tap">
            <span class="brand-mark" data-icon="brand" data-icon-size="24"></span>
            <span class="brand-name">claude-tap</span>
            <span class="version" id="app-version">v0</span>
          </div>
          <button class="icon-button sidebar-toggle" id="toggle-sidebar" type="button" aria-label="Collapse sidebar" aria-controls="session-panel" aria-expanded="true">
            <span class="sidebar-rest-icon" data-icon="brand" data-icon-size="24"></span>
            <span class="sidebar-panel-icon" data-icon="panel" data-icon-size="18"></span>
          </button>
        </div>

        <div class="sidebar-wide sidebar-browser" id="sidebar-browser" data-search-expanded="false">
          <div class="sidebar-section-header">
            <span class="sidebar-section-label" id="session-heading">Sessions</span>
            <span class="visually-hidden" id="session-count">0</span>
            <div class="sidebar-search-slot">
              <div class="sidebar-search-shell" id="sidebar-search-shell" role="search">
                <button class="sidebar-search-button" id="session-search-toggle" type="button" aria-label="Search sessions" aria-controls="session-search" aria-expanded="false">
                  <span data-icon="search" data-icon-size="14"></span>
                </button>
                <input id="session-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search sessions" tabindex="-1">
                <button class="sidebar-search-clear" id="session-search-clear" type="button" aria-label="Clear search" hidden>
                  <span data-icon="closeFill" data-icon-size="14"></span>
                </button>
              </div>
            </div>
            <div class="sidebar-header-actions">
              <div class="menu-anchor">
                <button class="sidebar-header-button" id="capture-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose capture">
                  <span class="capture-icon" data-icon="archive" data-icon-size="16"></span>
                  <span class="visually-hidden" id="capture-label">Capture</span>
                  <span class="visually-hidden" id="capture-value">Loading…</span>
                </button>
                <div class="menu-popover capture-menu" id="capture-menu" role="menu" hidden></div>
              </div>
            </div>
          </div>
          <div class="session-list" id="session-list" tabindex="0">
            <div class="virtual-canvas" id="session-canvas"></div>
          </div>
        </div>

        <div class="sidebar-rail-actions" id="sidebar-rail-actions" aria-label="Session shortcuts">
          <button class="sidebar-rail-action" id="rail-capture" type="button" aria-label="Choose capture" aria-controls="capture-menu">
            <span data-icon="archive" data-icon-size="18"></span>
          </button>
          <button class="sidebar-rail-action" id="rail-search" type="button" aria-label="Search sessions" aria-controls="session-search">
            <span data-icon="search" data-icon-size="18"></span>
          </button>
        </div>

        <div class="sidebar-foot">
          <span class="capture-foot sidebar-wide" id="capture-foot" hidden></span>
          <div class="menu-anchor">
            <button class="icon-button" id="settings-trigger" type="button" aria-label="Viewer settings" aria-haspopup="menu" aria-expanded="false">
              <span data-icon="settings" data-icon-size="16"></span>
              <span class="settings-label sidebar-wide" id="settings-label">Settings</span>
            </button>
            <div class="menu-popover menu-up align-right" id="settings-menu" role="menu" hidden></div>
          </div>
        </div>
      </aside>
    </div>

    <section class="call-panel" id="call-panel" aria-label="Model calls">
      <header class="session-bar">
        <button class="icon-button mobile-sidebar-button" id="open-sidebar" type="button" aria-label="Open sessions" aria-controls="session-panel" aria-expanded="false">
          <span data-icon="panel"></span>
        </button>
        <div class="session-title-block">
          <h1 id="active-session-title">Select a session</h1>
          <div class="session-facts" id="active-session-facts"></div>
        </div>
        <div class="session-bar-actions">
          <button class="icon-button reopen-inspector" id="reopen-inspector" type="button" aria-label="Open selected request" hidden>
            <span data-icon="panel" data-icon-class="flip-x"></span>
          </button>
          <div class="menu-anchor">
            <button class="icon-button" id="session-options-trigger" type="button" aria-label="Session actions" aria-haspopup="menu" aria-expanded="false">
              <span data-icon="ellipsis"></span>
            </button>
            <div class="menu-popover align-right" id="session-options-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <div class="call-toolbar">
        <label class="search-field trace-search">
          <span data-icon="search"></span>
          <input id="trace-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search output, tools, prompts">
        </label>
        <div class="menu-anchor model-picker">
          <button class="compact-trigger" id="model-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="compact-trigger-value" id="model-value">All models</span>
            <span data-icon="chevron" data-icon-size="14"></span>
          </button>
          <div class="menu-popover align-right" id="model-menu" role="menu" hidden></div>
        </div>
        <span class="result-count" id="result-count" role="status" aria-live="polite">0 calls</span>
      </div>

      <div class="call-list-head" id="call-list-head">
        <span class="call-head-index"><span id="call-head-time">Time</span><span class="visually-hidden" id="call-head-call">Call</span></span><span>Activity</span><span>Model / usage</span><span>Duration</span>
      </div>
      <div class="trajectory-list" id="trajectory-list" tabindex="0" aria-label="Model calls">
        <div class="virtual-canvas" id="trajectory-canvas"></div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <strong id="empty-title">No model calls match</strong>
        <span id="empty-copy">Try another search or session.</span>
      </div>
    </section>

    <aside class="inspector" id="inspector" aria-label="Request inspector" aria-hidden="true" inert>
      <div class="resize-handle" id="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize inspector" aria-valuemin="380" aria-valuemax="1760" title="Drag to resize; double-click to focus the inspector" tabindex="0"></div>
      <header class="inspector-header">
        <div class="inspector-heading">
          <div class="inspector-title-row">
            <span class="inspector-kicker" id="inspector-kicker" aria-hidden="true"></span>
            <h2 id="inspector-title">Request details</h2>
            <div class="inspector-facts" id="inspector-facts"></div>
          </div>
        </div>
        <div class="inspector-header-actions">
          <button class="icon-button" id="copy-active-view" type="button" aria-label="Copy current view" disabled hidden>
            <span data-icon="copy"></span>
          </button>
          <div class="menu-anchor">
            <button class="icon-button" id="inspector-options-trigger" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" disabled>
              <span data-icon="ellipsis"></span>
            </button>
            <div class="menu-popover align-right" id="inspector-options-menu" role="menu" hidden></div>
          </div>
          <button class="icon-button close-button" id="close-inspector" type="button" aria-label="Close inspector">
            <span data-icon="close"></span>
          </button>
        </div>
      </header>
      <nav class="inspector-tabs" id="inspector-tabs" role="tablist" aria-label="Request views"></nav>
      <div class="inspector-tools" id="inspector-filter-wrap" hidden>
        <label class="search-field inspector-search">
          <span data-icon="search"></span>
          <input id="inspector-filter" type="search" autocomplete="off" spellcheck="false" placeholder="Filter this view">
        </label>
      </div>
      <div class="inspector-body" id="inspector-body" role="tabpanel" tabindex="0"></div>
    </aside>
  </main>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <!-- claude-tap:inject -->
  <!-- claude-tap:scripts -->
</body>
</html>
