<meta name="color-scheme" content="light dark">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%25%27 stop-color=%27%233b82f6%27/%3E%3Cstop offset=%27100%25%27 stop-color=%27%2310b981%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M32 16v16l10 6%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 fill=%27none%27/%3E%3C/svg%3E">
<title>claude-tap Viewer</title>
<style>
:root {
  --bg: #f4f5f7;
  --bg-card: #ffffff;
  --bg-hover: #f0f1f4;
  --bg-active: #e8ecf4;
  --bg-code: #f6f8fa;
  --border: #e2e4e9;
  --border-light: #edeef1;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 10px;
  --radius-sm: 6px;

  --text: #1c2024;
  --text-secondary: #60646c;
  --text-tertiary: #a0a4ab;

  --blue: #3b82f6;
  --blue-bg: #eff6ff;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --amber: #f59e0b;
  --amber-bg: #fffbeb;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-bg-hi: #fecaca;
  --green-bg-hi: #bbf7d0;
  --purple: #8b5cf6;
  --purple-bg: #f5f3ff;
  --cyan: #06b6d4;
  --cyan-bg: #ecfeff;
  --orange: #f97316;
  --orange-bg: #fff7ed;
  --indigo: #6366f1;
  --indigo-bg: #eef2ff;

  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-hover: #1c2128;
  --bg-active: #252c35;
  --bg-code: #1c2128;
  --border: #30363d;
  --border-light: #21262d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.55);
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --blue: #58a6ff;
  --blue-bg: #0d2240;
  --green: #3fb950;
  --green-bg: #0d2d1a;
  --amber: #d29922;
  --amber-bg: #2d2200;
  --red: #f85149;
  --red-bg: #3d1117;
  --red-bg-hi: #6b2020;
  --green-bg-hi: #1a5c33;
  --purple: #bc8cff;
  --purple-bg: #1f1338;
  --cyan: #39d2c0;
  --cyan-bg: #0a2e2c;
  --orange: #f0883e;
  --orange-bg: #2d1b00;
  --indigo: #8b8fff;
  --indigo-bg: #1e1b40;
}
[data-theme="dark"] .msg.user { border-color: #1f3a5f; }
[data-theme="dark"] .msg.assistant { border-color: #1a3a26; }
[data-theme="dark"] .msg.system { border-color: #3d3000; }
[data-theme="dark"] .msg.tool_result { border-color: #2a1f48; }
[data-theme="dark"] .msg pre, [data-theme="dark"] .msg .pre-text { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
[data-theme="dark"] .json-host {
  --jk-color: #bc8cff;     /* keys */
  --js-color: #3fb950;     /* strings */
  --jn-color: #d29922;     /* numbers */
  --jb-color: #f85149;     /* booleans */
  --jp-color: #8b949e;     /* punctuation */
  --jpv-color: #6e7681;    /* collapsed preview text */
  --jg-color: rgba(255,255,255,0.06);  /* indent guide */
}
*,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ─── Header ─── */
.header {
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; min-height: 52px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 10;
}
.header .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header .logo svg { width: 22px; height: 22px; }
.header .logo span { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
.header .logo .logo-version {
  display: none; align-items: center;
  font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
  color: var(--text-tertiary); background: var(--bg);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 1px 6px; line-height: 1.4;
}
.header .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.path-filter { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; flex: 1 1 0; }
.filter-chip-errors {
  margin-left: auto;
}
.filter-chip-errors.active {
  background: var(--red-bg) !important; border-color: var(--red) !important; color: var(--red) !important;
}
.filter-chip-toggle {
  font-size: 11px; font-family: var(--sans); padding: 4px 10px; border-radius: 20px;
  border: 1px dashed var(--border); background: var(--bg); color: var(--text-tertiary);
  cursor: pointer; transition: all .15s; white-space: nowrap; line-height: 1;
}
.filter-chip-toggle:hover { border-color: var(--blue); color: var(--blue); }
.filter-chip {
  font-size: 12px; font-family: var(--mono); padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; transition: all .15s; white-space: nowrap; line-height: 1;
}
.filter-chip:hover { border-color: var(--blue); color: var(--blue); }
.filter-chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.filter-chip .chip-count { font-size: 10px; margin-left: 4px; opacity: .6; }
.tool-chip {
  font-size: 10px; font-family: var(--mono); padding: 2px 6px; margin: 1px;
  border-radius: 14px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
  transition: all .15s; white-space: nowrap; line-height: 1;
}
.tool-chip:hover { border-color: var(--blue); color: var(--blue); }
.tool-chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.tool-chip.is-clear { color: var(--red); border-color: var(--red); }
.header-spacer { flex: 1; }

/* ─── Back-to-top floating button (over the .detail panel) ─── */
.back-to-top {
  position: fixed; right: 24px; bottom: 24px; z-index: 50;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); font-size: 16px;
  cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  display: none; align-items: center; justify-content: center;
  transition: all .15s;
}
.back-to-top.show { display: flex; }
.back-to-top:hover { color: var(--blue); border-color: var(--blue); }
.trace-path-bar {
  display: none; align-items: center; gap: 6px; padding: 4px 12px;
  background: var(--bg); border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text-tertiary); font-family: var(--mono);
  flex-shrink: 0;
}
.trace-path-bar .tp-label { font-family: var(--sans); font-weight: 500; color: var(--text-secondary); flex-shrink: 0; }
.trace-path-bar .tp-val { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.trace-path-bar .tp-copy {
  flex-shrink: 0; cursor: pointer; border: none; background: none;
  color: var(--text-tertiary); padding: 2px 4px; border-radius: 3px; line-height: 1;
}
.trace-path-bar .tp-copy:hover { color: var(--blue); background: var(--blue-bg); }
.trace-path-bar .tp-sep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }

/* ─── Layout ─── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar ─── */
#sidebar-wrap {
  width: 300px; min-width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-card);
}
#sidebar-wrap:not([hidden]) {
  display: flex; flex-direction: column;
}
#session-picker {
  padding: 6px 12px; gap: 8px; align-items: center;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
#session-picker:not([hidden]) { display: flex; }
#session-picker label { color: var(--text-secondary); white-space: nowrap; }
#session-select {
  flex: 1; padding: 3px 6px; border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text);
  font-size: 13px; cursor: pointer;
}
#tool-filter {
  padding: 4px 8px; font-size: 11px;
  max-height: 120px; overflow-y: auto;
  border-bottom: 1px solid var(--border);
}
.sidebar {
  flex: 1;
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.sidebar-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; cursor: pointer; user-select: none;
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  background: var(--bg); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1;
  text-transform: uppercase; letter-spacing: .5px;
}
/* "Internal" / metadata group: don't shout, it's just GET /v1/models etc. */
.sidebar-group-header.is-internal {
  text-transform: none; letter-spacing: normal;
  font-weight: 500; color: var(--text-tertiary);
}
.sidebar-group-header:hover { background: var(--bg-hover); }
.sidebar-group-header .group-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.sidebar-group-header .group-name { flex: 1; }
.sidebar-group-header .group-count {
  font-size: 10px; font-weight: 500; color: var(--text-tertiary);
  background: var(--bg-hover); padding: 1px 6px; border-radius: 8px;
}
.sidebar-group-header .group-chevron {
  font-size: 10px; color: var(--text-tertiary); transition: transform .15s;
}
.sidebar-group-header .group-chevron.open { transform: rotate(90deg); }

.sidebar-item {
  padding: 10px 16px; cursor: pointer; transition: background .1s;
  border-bottom: 1px solid var(--border-light); position: relative;
  border-left: 3px solid transparent;
}
.sidebar-item:hover { background: var(--bg-hover); }
.sidebar-item.active { background: var(--blue-bg); }
.sidebar-item .si-row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.sidebar-item .si-turn-wrap { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.sidebar-item .si-turn { font-size: 13px; font-weight: 600; color: var(--text); }
.sidebar-item .si-error-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
  flex-shrink: 0;
}
.sidebar-item.is-error { border-left-color: var(--red) !important; }
.sidebar-item.is-error .si-path { color: var(--red); }
.sidebar-item .si-model {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
  font-weight: 500; margin-left: auto;
}
.sidebar-item .si-row2 { display: flex; gap: 10px; font-size: 11px; }
.sidebar-item .si-tok { color: var(--green); font-family: var(--mono); font-weight: 500; }
.sidebar-item .si-dur { color: var(--amber); font-family: var(--mono); font-weight: 500; }
.sidebar-item .si-time { color: var(--text-tertiary); font-family: var(--mono); font-weight: 500; margin-left: auto; }
.sidebar-item .si-task {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  font-weight: 500; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item .si-path {
  font-size: 10px; color: var(--text-tertiary); font-family: var(--mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
}

/* ─── Detail ─── */
.detail { flex: 1; overflow-y: auto; padding: 0 20px 12px; background: var(--bg); }
/* The visual top spacing lives on the first child, not as .detail
   padding, so a sticky section header pins flush against the scroll
   container's top edge instead of leaving a gap above the pinned bar
   that prior content scrolls through. */
.detail > *:first-child { margin-top: 12px; }
.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.error-banner {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; margin: 0 0 12px;
  border: 1px solid var(--red); border-left: 4px solid var(--red);
  border-radius: var(--radius-sm); background: var(--red-bg);
}
.error-banner .eb-icon { color: var(--red); font-size: 15px; line-height: 1.2; flex-shrink: 0; }
.error-banner .eb-content { min-width: 0; }
.error-banner .eb-title { font-size: 13px; font-weight: 700; color: var(--red); line-height: 1.4; }
.error-banner .eb-message {
  margin-top: 2px; font-size: 12px; color: var(--text-secondary);
  white-space: pre-wrap; word-break: break-word;
}

/* ─── Action bar (buttons left, per-turn token chips right) ─── */
.action-bar {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  margin: 0 0 8px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
}
.act-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text-secondary); cursor: pointer; font-family: var(--sans);
  transition: all .15s; line-height: 1;
}
.act-btn:hover { background: var(--bg-hover); color: var(--blue); border-color: var(--blue); }
.act-btn:active { transform: translateY(1px); }
.act-btn svg { width: 12px; height: 12px; }
.tok-chips {
  margin-left: auto; display: inline-flex; align-items: center;
  gap: 8px; padding: 0 4px;
}
.tok-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-family: var(--mono);
  color: var(--text-secondary);
}
[data-theme="dark"] .action-bar { border-color: #3a4048; }

/* ─── Section ─── */
/* No ``overflow: hidden`` on ``.section`` so the header can stick to the
   top of ``.detail`` while the body scrolls past — user can collapse a
   long section from anywhere within it. */
.section {
  margin-bottom: 8px; border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card); box-shadow: var(--shadow-sm);
}
.section-header {
  display: flex; align-items: center; padding: 8px 12px;
  cursor: pointer; user-select: none; gap: 8px;
  transition: background .1s, box-shadow .15s, border-radius .15s;
  position: sticky; top: 0; z-index: 3;
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
}
.section-header:hover { background: var(--bg-hover); }
/* When the header is stuck to the top of the scroll container, drop the
   top rounded corners and add a subtle drop-shadow / divider so the
   floating bar reads as "anchored" rather than disconnected from the
   content scrolling beneath. The .stuck class is toggled by an
   IntersectionObserver in initStickyHeaders. */
.section-header.stuck {
  border-radius: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  border-bottom: 1px solid var(--border);
}
.section-header .chevron {
  font-size: 10px; color: var(--text-tertiary); transition: transform .2s; width: 12px;
}
.section-header .chevron.open { transform: rotate(90deg); }
.section-header .title { font-size: 13px; font-weight: 600; color: var(--text); }
.section-header .badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--bg); color: var(--text-tertiary); font-weight: 500; margin-left: auto;
}
.section-header .copy-btn {
  font-size: 11px; padding: 3px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-tertiary); cursor: pointer; margin-left: 6px; transition: all .15s;
}
.section-header .copy-btn:hover { color: var(--blue); border-color: var(--blue); }
.section-body { padding: 0 16px 16px; display: none; overflow-x: auto; }
.section-body.open { display: block; }
.section-body pre, .section-body .pre-text {
  white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
  font-size: 12px; background: var(--bg-code); padding: 12px 14px;
  border-radius: var(--radius-sm); line-height: 1.6; border: 1px solid var(--border-light);
  max-height: 500px; overflow-y: auto;
}

/* ─── Messages ─── */
.msg {
  margin-bottom: 8px; border-radius: var(--radius-sm);
  padding: 12px 16px; font-size: 13px; line-height: 1.6;
  border: 1px solid var(--border-light);
}
.msg.user { background: var(--blue-bg); border-color: #c7d2fe; }
.msg.assistant { background: var(--green-bg); border-color: #a7f3d0; }
.msg.system { background: var(--amber-bg); border-color: #fde68a; }
.msg.tool_result { background: var(--purple-bg); border-color: #c4b5fd; }
.msg-role {
  display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
}
.msg.user .msg-role { background: var(--blue); color: #fff; }
.msg.assistant .msg-role { background: var(--green); color: #fff; }
.msg.system .msg-role { background: var(--amber); color: #fff; }
.msg.tool_result .msg-role { background: var(--purple); color: #fff; }
.msg pre, .msg .pre-text {
  white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
  font-size: 12px; background: rgba(0,0,0,0.04); padding: 10px 12px;
  border-radius: var(--radius-sm); margin-top: 8px; max-height: 400px;
  overflow-y: auto; border: 1px solid rgba(0,0,0,0.06); line-height: 1.5;
}
.content-meta { color: var(--text-tertiary); font: 11px var(--mono); margin: 5px 0 7px; word-break: break-all; }
.content-block { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
.content-block:first-child { margin-top: 0; }
.tool-use-label {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: var(--cyan);
  background: var(--cyan-bg); padding: 2px 8px; border-radius: 4px; margin-bottom: 4px;
}
.thinking-label {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: var(--indigo);
  background: var(--indigo-bg); padding: 2px 8px; border-radius: 4px; margin-bottom: 4px;
}

/* ─── Tool blocks ─── */
.tool-block {
  border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  margin-bottom: 4px; overflow: hidden; background: var(--bg-card);
}
.tool-block-header {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 12px; cursor: pointer; user-select: none; transition: background .1s;
  /* When a tool is expanded, keep its header visible while the user
     scrolls inside its body so they can collapse it from anywhere. */
  position: sticky; top: 0; z-index: 2; background: var(--bg-card);
}
.tool-block-header:hover { background: var(--bg-hover); }
.tb-arrow { font-size: 9px; color: var(--text-tertiary); transition: transform .15s; flex-shrink: 0; }
.tb-arrow.open { transform: rotate(90deg); }
.tb-name { color: var(--cyan); font-family: var(--mono); font-size: 12px; font-weight: 600; flex-shrink: 0; }
.tb-desc { color: var(--text-tertiary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tool-block-body {
  display: none; padding: 10px 12px 12px; border-top: 1px solid var(--border-light); font-size: 12px;
}
.tool-block-body.open { display: block; }
.tb-full-desc {
  color: var(--text-secondary); white-space: pre-wrap; word-break: break-word;
  margin-bottom: 10px; line-height: 1.55; font-size: 12px;
}
.tb-params-title { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .3px; }
.tb-param {
  padding: 8px 10px; margin-bottom: 4px; border-radius: var(--radius-sm);
  background: var(--bg); font-size: 12px;
}
.tb-param:last-child { margin-bottom: 0; }
.tb-param-row1 { display: flex; align-items: center; gap: 8px; }
.tb-pname { color: var(--blue); font-family: var(--mono); font-weight: 600; font-size: 12px; }
.tb-ptype {
  font-size: 10px; font-family: var(--mono); color: var(--amber);
  background: var(--amber-bg); padding: 1px 6px; border-radius: 3px; font-weight: 500;
}
.tb-prequired {
  font-size: 10px; font-weight: 600; color: var(--red);
  background: var(--red-bg); padding: 1px 6px; border-radius: 3px;
}
.tb-pdesc {
  color: var(--text-tertiary); margin-top: 4px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; font-size: 12px;
}
.tb-penum {
  font-size: 10px; font-family: var(--mono); color: var(--cyan);
  background: var(--cyan-bg, rgba(34, 211, 238, 0.12));
  padding: 1px 6px; border-radius: 3px; font-weight: 500;
}
.tb-pformat {
  font-size: 10px; font-family: var(--mono); color: var(--text-tertiary);
  background: var(--bg-hover); padding: 1px 6px; border-radius: 3px;
}
.tb-pdefault {
  font-size: 10px; font-family: var(--mono); color: var(--green);
  background: var(--green-bg, rgba(34, 197, 94, 0.12));
  padding: 1px 6px; border-radius: 3px;
}
.tb-pchildren {
  margin-top: 6px; padding-left: 10px;
  border-left: 2px solid var(--border);
}
.tb-pchild-label {
  font-size: 10px; color: var(--text-tertiary); font-family: var(--mono);
  text-transform: uppercase; letter-spacing: .3px;
  margin: 4px 0 4px;
}

/* ─── Markdown host (Raw / MD toggle in section header) ─── */
.md-host { position: relative; }
.md-toggle {
  display: inline-flex; gap: 2px; padding: 2px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); font-size: 11px;
  margin-left: auto;  /* pushes to the right side of the section-header */
}
.md-tab {
  border: 0; background: transparent; cursor: pointer;
  padding: 3px 10px; border-radius: 4px;
  color: var(--text-tertiary); font-family: var(--sans); font-size: 11px;
}
.md-tab.active { background: var(--bg-card); color: var(--text); font-weight: 600; }
.md-host[data-mode="raw"] .md-view-md { display: none; }
.md-host[data-mode="md"]  .md-view-raw { display: none; }
.md-body { line-height: 1.55; font-size: 13px; color: var(--text); }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { margin: 12px 0 6px; line-height: 1.3; }
.md-body h1 { font-size: 18px; }
.md-body h2 { font-size: 16px; }
.md-body h3 { font-size: 14px; }
.md-body p { margin: 6px 0; }
.md-body ul, .md-body ol { margin: 6px 0; padding-left: 22px; }
.md-body li { margin: 2px 0; }
.md-body a { color: var(--blue); }
.md-body blockquote {
  border-left: 3px solid var(--border); padding-left: 10px;
  color: var(--text-secondary); margin: 6px 0;
}
.md-body strong { font-weight: 600; }
.md-body em { font-style: italic; }
.md-icode {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-hover); padding: 1px 4px; border-radius: 3px;
}
.md-code {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg); padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); overflow-x: auto;
  white-space: pre; margin: 8px 0;
}

/* ─── Token usage ─── */
.token-bar { display: flex; gap: 12px; font-size: 11px; padding: 4px 0 6px; flex-wrap: wrap; margin-bottom: 4px; }
.tok-item { display: flex; align-items: center; gap: 4px; }
.tok-dot { width: 6px; height: 6px; border-radius: 50%; }
.tok-label { color: var(--text-tertiary); font-size: 11px; }
.tok-val { color: var(--text-secondary); font-weight: 600; font-family: var(--mono); font-size: 11px; }

/* ─── JSON viewer (custom tree, with collapsed preview + wrap toggle) ───
   Each node renders as ``.jline`` rows. Objects/arrays use ``<details>``:
   when collapsed, summary shows ``▶ {key: val, …N more}``; when expanded,
   summary shows ``▼ {`` and a separate close-brace row sits at the parent
   indent. Indent guides are subtle vertical rules on each ``.jchildren``.
   The wrap toggle flips ``data-wrap`` on the host between ``off`` (every
   .jline is single-line, host scrolls horizontally) and ``on`` (long
   string values flow onto the next line). */
.json-host {
  position: relative;
  background: var(--bg-code); padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  max-height: 600px; overflow: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  --jk-color: #7c3aed;
  --js-color: #059669;
  --jn-color: #d97706;
  --jb-color: #dc2626;
  --jp-color: #6b7280;
  --jpv-color: #6b7280;
  --jg-color: rgba(0,0,0,0.06);
}
.json-host[data-wrap="off"] .jline { white-space: pre; }
.json-host[data-wrap="on"]  .jline { white-space: pre-wrap; word-break: break-word; }
.json-host .jline { padding-left: 0; }
.json-host .jdet { display: block; }
.json-host .jdet > summary {
  list-style: none; cursor: pointer; outline: none;
  border-radius: 3px;
}
.json-host .jdet > summary::-webkit-details-marker { display: none; }
.json-host .jdet > summary:hover { background: var(--bg-hover); }
.json-host .jchev {
  display: inline-block; width: 12px;
  color: var(--jp-color); font-size: 9px;
  transition: transform .15s; user-select: none;
}
.json-host .jdet[open] > summary .jchev { transform: rotate(90deg); }
.json-host .jdet[open] > summary .jpreview,
.json-host .jdet[open] > summary .jb-collapsed-close { display: none; }
.json-host .jdet:not([open]) > .jchildren,
.json-host .jdet:not([open]) > .jclose { display: none; }
.json-host .jchildren {
  margin-left: 0;
  padding-left: 16px;
  border-left: 1px solid var(--jg-color);
}
.json-host .jclose { padding-left: 0; }
/* Type colours and punctuation. Punctuation (``:``, ``,``, ``{``, ``}``)
   stays muted so the eye lands on the keys/values. */
.json-host .jp { color: var(--jp-color); }
.json-host .jk { color: var(--jk-color); }
.json-host .js { color: var(--js-color); }
.json-host .jn { color: var(--jn-color); }
.json-host .jb { color: var(--jb-color); }
.json-host .jnull { color: var(--jp-color); font-style: italic; }
.json-host .jpreview { color: var(--jpv-color); }
/* Compact icon-led control group lives in the .section-header (right side),
   matching the .md-toggle pattern — no extra row above the JSON view. */
.json-controls {
  display: inline-flex; gap: 2px; padding: 2px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); font-size: 11px; margin-left: auto;
}
.json-controls .json-btn {
  border: 0; background: transparent; cursor: pointer;
  padding: 3px 8px; border-radius: 4px;
  color: var(--text-tertiary); font-family: var(--sans); font-size: 11px;
  display: inline-flex; align-items: center; gap: 4px;
  line-height: 1; transition: color .12s, background .12s;
}
.json-controls .json-btn:hover { color: var(--blue); background: var(--bg-card); }
.json-controls .json-btn.active { color: var(--text); background: var(--bg-card); font-weight: 600; }
.json-controls .ji-ico { font-size: 13px; line-height: 1; }

/* ─── Search box embedded in JSON / Tools section toolbars ─── */
.json-search, .tool-filter-input {
  width: 160px; padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 11px; font-family: var(--sans); color: var(--text);
  margin-left: 4px;
}
.json-search:focus, .tool-filter-input:focus {
  outline: none; border-color: var(--blue);
}
.tool-filter-row {
  position: sticky; top: 0; z-index: 1;
  background: var(--bg-card); padding: 4px 0 8px;
  display: flex; gap: 8px; align-items: center;
}
.tool-filter-input { flex: 1; max-width: 360px; }
.tool-filter-count {
  font-size: 11px; color: var(--text-tertiary);
}
/* Filtered-out lines hide; matching lines + ancestors stay visible.
   Hits get a soft yellow wash so the eye lands on them. */
.json-host.jfiltered .jhide { display: none; }
.json-host .jhit { background: rgba(251,191,36,0.18); border-radius: 2px; }
[data-theme="dark"] .json-host .jhit { background: rgba(251,191,36,0.14); }

/* ─── Diff modal ─── */
.diff-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  overflow-y: auto; padding: 16px 12px;
  z-index: 100; backdrop-filter: blur(2px);
}
.diff-modal {
  background: var(--bg); border-radius: 14px;
  width: 96vw; max-width: 1400px; height: 92vh; max-height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.2);
}
.diff-header {
  display: flex; align-items: center; padding: 16px 20px;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  border-radius: 14px 14px 0 0;
}
.diff-header .diff-title { font-size: 14px; font-weight: 600; color: var(--text); }
.diff-nav-btn {
  background: var(--bg-hover); border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-secondary); cursor: pointer;
  padding: 3px 10px; line-height: 1.2;
}
.diff-nav-btn:hover:not(:disabled) { background: var(--bg-active); color: var(--text); }
.diff-nav-btn:disabled { opacity: 0.3; cursor: default; }
.diff-nav-prev { margin-right: 8px; }
.diff-nav-next { margin-left: 8px; }
.diff-header .diff-close {
  margin-left: auto; background: none; border: none;
  font-size: 18px; color: var(--text-tertiary); cursor: pointer;
  padding: 4px 10px; border-radius: var(--radius-sm); line-height: 1;
}
.diff-header .diff-close:hover { background: var(--bg-hover); color: var(--text); }
.diff-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }
.diff-fallback-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; margin: 8px 20px 0;
  background: var(--amber-bg); border: 1px solid var(--amber);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--amber);
  font-weight: 500;
}
.diff-fallback-banner .dfb-icon { font-size: 14px; flex-shrink: 0; }
.diff-target-select {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
}
.diff-target-select select {
  font-size: 11px; color: var(--text); background: var(--bg-hover);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 2px 6px; cursor: pointer; max-width: 200px;
}
.diff-target-select select:hover { border-color: var(--text-tertiary); }
.diff-target-select select:focus { outline: none; border-color: var(--accent, #6c8ebf); }
.diff-section {
  margin-bottom: 14px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.diff-section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--text);
}
.diff-section-header .ds-badge {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
}
.diff-section-header .ds-badge.add { background: var(--green-bg); color: var(--green); }
.diff-section-header .ds-badge.del { background: var(--red-bg); color: var(--red); }
.diff-section-header .ds-badge.change { background: var(--amber-bg); color: var(--amber); }
.diff-section-header .ds-badge.same { background: var(--bg); color: var(--text-tertiary); }
.diff-section-body { padding: 0 16px 14px; }
.diff-unchanged-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text-tertiary);
  font-size: 12px; margin-bottom: 8px;
}
.diff-unchanged-bar .dub-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.diff-new-msg {
  position: relative; margin-bottom: 8px;
  border: 2px solid var(--green); border-radius: var(--radius-sm);
  max-height: 220px; overflow-y: auto;
}
.diff-new-msg::before {
  content: attr(data-label); position: absolute; top: -1px; right: 10px;
  font-size: 9px; font-weight: 700; letter-spacing: .5px;
  color: #fff; background: var(--green); padding: 2px 8px;
  border-radius: 0 0 4px 4px;
}
.diff-removed-msg {
  position: relative; margin-bottom: 8px;
  border: 2px solid var(--red); border-radius: var(--radius-sm); opacity: .7;
  max-height: 220px; overflow-y: auto;
}
.diff-removed-msg::before {
  content: attr(data-label); position: absolute; top: -1px; right: 10px;
  font-size: 9px; font-weight: 700; letter-spacing: .5px;
  color: #fff; background: var(--red); padding: 2px 8px;
  border-radius: 0 0 4px 4px;
}
.diff-modified-msg {
  margin-bottom: 8px;
  border: 2px solid var(--amber); border-radius: var(--radius-sm);
  max-height: 260px; overflow-y: auto;
}
.diff-modified-msg .sbs-diff { border: none; border-radius: 0; }
.diff-field-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--border-light);
  font-size: 12px;
}
.diff-field-row:last-child { border-bottom: none; }
.diff-field-key { font-family: var(--mono); font-weight: 600; color: var(--text); min-width: 120px; flex-shrink: 0; }
.diff-field-old {
  font-family: var(--mono); color: var(--red); text-decoration: line-through;
  background: var(--red-bg); padding: 1px 6px; border-radius: 3px; max-width: 300px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.diff-field-arrow { color: var(--text-tertiary); flex-shrink: 0; }
.diff-field-new {
  font-family: var(--mono); color: var(--green);
  background: var(--green-bg); padding: 1px 6px; border-radius: 3px; max-width: 300px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* ─── Side-by-side JSON diff ─── */
.diff-side-by-side { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.diff-side-by-side .diff-panel { flex: 1; min-width: 0; overflow: auto; }
.diff-side-by-side .diff-panel-header {
  padding: 6px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1;
}
.diff-side-by-side .diff-panel.old { background: var(--red-bg); }
.diff-side-by-side .diff-panel.old .diff-panel-header { background: var(--red-bg); color: var(--red); }
.diff-side-by-side .diff-panel.new { background: var(--green-bg); }
.diff-side-by-side .diff-panel.new .diff-panel-header { background: var(--green-bg); color: var(--green); }
.diff-side-by-side pre {
  margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11px;
  line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--text);
}

/* ─── Side-by-side line diff ─── */
.sbs-diff {
  display: grid; grid-template-columns: 1fr 1fr;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: auto; max-height: 400px;
}
.sbs-diff .sbs-header {
  padding: 4px 12px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1; background: var(--bg-card);
}
.sbs-diff .sbs-header.old { color: var(--red); }
.sbs-diff .sbs-header.new { color: var(--green); }
.sbs-cell {
  padding: 1px 10px; white-space: pre-wrap; word-break: break-word;
  border-bottom: 1px solid var(--border-light);
}
.sbs-cell.ctx { color: var(--text-tertiary); opacity: 0.5; }
.sbs-cell.del { background: var(--red-bg); color: var(--red); }
.sbs-cell.add { background: var(--green-bg); color: var(--green); }
.sbs-cell.empty { background: var(--bg-code); }
.sbs-fold {
  grid-column: 1 / -1; text-align: center;
  padding: 2px 12px; color: var(--text-tertiary); font-style: italic;
  background: var(--bg); border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light); font-size: 11px;
}
.sys-diff-del-hi { background: var(--red-bg-hi); border-radius: 3px; padding: 1px 1px; }
.sys-diff-add-hi { background: var(--green-bg-hi); border-radius: 3px; padding: 1px 1px; }

/* ─── SSE events ─── */
.sse-event { margin-bottom: 4px; font-family: var(--mono); font-size: 12px; padding: 3px 0; }
.sse-type { color: var(--cyan); font-weight: 600; margin-right: 8px; }
.sse-data { color: var(--text-tertiary); white-space: pre-wrap; word-break: break-word; }

/* ─── Drop zone ─── */
.drop-zone { align-items: center; justify-content: center; flex: 1; padding: 40px; }
.drop-zone:not([hidden]) { display: flex; }
.drop-zone-inner {
  border: 2px dashed var(--border); border-radius: 16px;
  padding: 60px 40px; text-align: center; max-width: 480px;
  transition: all .25s; background: var(--bg-card);
}
.drop-zone-inner.dragover { border-color: var(--blue); background: var(--blue-bg); }
.drop-zone-inner h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
.drop-zone-inner p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.drop-zone-inner input[type="file"] { display: none; }
.drop-zone-inner label {
  display: inline-block; padding: 10px 24px; background: var(--blue);
  color: #fff; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px;
  font-weight: 500; transition: background .15s;
}
.drop-zone-inner label:hover { background: #2563eb; }

/* ─── Live status pill (in header) ─── */
#live-status {
  padding: 4px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
  align-items: center; gap: 6px;
}
#live-status:not([hidden]) { display: inline-flex; }
.live-status-dot { width: 6px; height: 6px; border-radius: 50%; }
.live-status-dot.is-live { animation: pulse 2s infinite; }

/* ─── Live waiting placeholder (no records yet) ─── */
.live-waiting {
  text-align: center; padding: 60px 20px;
}
.live-waiting-icon { font-size: 48px; margin-bottom: 16px; }
.live-waiting h2 { margin-bottom: 8px; font-size: 18px; color: var(--text); font-weight: 600; }
.live-waiting p { color: var(--text-secondary); font-size: 14px; }

/* ─── Empty state ─── */
.empty-state { padding: 40px; text-align: center; color: var(--text-tertiary); font-size: 14px; }

/* ─── Scrollbar for detail ─── */
/* ─── Search bar ─── */
.search-bar {
  position: relative; padding: 8px 12px; border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
.search-bar input {
  width: 100%; padding: 6px 10px 6px 30px; font-size: 12px; font-family: var(--sans);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); outline: none; transition: border-color .15s;
}
.search-bar input:focus { border-color: var(--blue); }
.search-bar input::placeholder { color: var(--text-tertiary); }
.search-bar .search-icon {
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  color: var(--text-tertiary); font-size: 13px; pointer-events: none;
}
.search-bar .search-clear {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-tertiary); cursor: pointer;
  font-size: 14px; padding: 2px 4px; display: none; line-height: 1;
}
.search-bar .search-clear:hover { color: var(--text); }

/* ─── Global find (Cmd/Ctrl+K) ─── */
.global-search-overlay {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 2000;
  display: none;
}
.global-search-overlay.open { display: block; }

/* Themed inline replacement for native prompt() — used by Cmd/Ctrl+G. */
.mini-overlay {
  position: fixed; top: 14px; right: 16px; z-index: 2000; display: none;
}
.mini-overlay.open { display: block; }
.mini-overlay-box {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-card); box-shadow: var(--shadow-md);
  font-size: 12px; color: var(--text);
}
.mini-overlay-box input {
  width: 100px; font-size: 12px; font-family: var(--mono);
  padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); outline: none;
}
.mini-overlay-box input:focus { border-color: var(--blue); }
.mini-overlay-hint { color: var(--text-tertiary); font-size: 11px; }
.global-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  box-shadow: var(--shadow-lg);
}
.global-search-box input {
  width: 260px;
  font-size: 12px;
  font-family: var(--sans);
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.global-search-box input:focus { border-color: var(--blue); }
.global-search-count {
  min-width: 90px;
  text-align: right;
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--mono);
}
.global-search-btn {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text-secondary);
  font-size: 11px;
  padding: 5px 8px;
  cursor: pointer;
}
.global-search-btn:hover { color: var(--blue); border-color: var(--blue); }
.global-search-hit {
  background: #fde047;
  color: inherit;
  border-radius: 2px;
  padding: 0;
}
.global-search-hit.current {
  background: #fb923c;
}

/* ─── Virtual scroll sidebar ─── */
.sidebar.virtual-scroll {
  position: relative;
  overflow-y: auto;
}
.sidebar .vs-spacer {
  position: relative;
  width: 100%;
}
.sidebar .vs-spacer .sidebar-item {
  position: absolute;
  left: 0;
  right: 0;
}

/* ─── Position indicator ─── */
.position-indicator {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-secondary);
  font-family: var(--mono);
  font-weight: 500;
}
.position-indicator .pi-current {
  color: var(--blue);
  font-weight: 700;
}
.position-indicator .pi-total {
  color: var(--text-tertiary);
}
.position-indicator .pi-bar {
  flex: 1;
  max-width: 120px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.position-indicator .pi-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width 0.15s;
}

/* ─── Time gap indicator ─── */
.time-gap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 3px 12px;
  font-size: 10px;
  color: var(--text-tertiary);
  background: var(--bg);
  border-bottom: 1px solid var(--border-light);
}
.time-gap .tg-line {
  flex: 1;
  height: 1px;
  background: var(--border);
  max-width: 40px;
}

/* ─── Theme toggle ─── */
.theme-toggle {
  background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px 8px; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center;
  transition: all .15s; font-size: 14px; line-height: 1;
}
.theme-toggle:hover { border-color: var(--blue); color: var(--blue); }

/* ─── Language selector ─── */
.lang-select {
  font-size: 12px; padding: 4px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; font-family: var(--sans); outline: none; margin-left: 8px;
}
.lang-select:hover { border-color: var(--blue); }

/* ─── RTL support ─── */
[dir="rtl"] #sidebar-wrap { border-right: none; border-left: 1px solid var(--border); }
[dir="rtl"] .sidebar-item { border-left: none; border-right: 3px solid transparent; }
[dir="rtl"] .si-model { margin-left: 0; margin-right: auto; }
[dir="rtl"] .stats { margin-left: 0; margin-right: auto; }
[dir="rtl"] .diff-field-arrow { transform: scaleX(-1); }

@media (max-width: 900px) {
  .sidebar { width: 240px; min-width: 200px; }
  .detail { padding: 0 16px 16px; }
  .detail > *:first-child { margin-top: 16px; }
}

/* Mobile back button hidden by default on desktop */
#mobile-back-btn { display: none; }

/* Mobile prev/next nav bar — hidden on desktop */
#mobile-nav-bar { display: none; }

/* ─── Mobile responsive (≤ 768px) ─── */
@media (max-width: 768px) {

  /* R1: Stacked layout — sidebar + detail stack vertically */
  body { overflow: auto; }
  .main { flex-direction: column; overflow: visible; }

  #sidebar-wrap {
    width: 100% !important;
    min-width: 0 !important;
    border-right: none;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .detail {
    flex: none;
    padding: 12px;
    overflow: visible;
    min-height: 0;
  }

  /* Mobile sidebar toggle: hide/show sidebar */
  #sidebar-wrap.mobile-hidden { display: none !important; }
  #detail.mobile-fullwidth { display: block !important; width: 100%; }

  /* Back button shown only on mobile */
  #mobile-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    background: var(--bg-card);
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--blue);
    cursor: pointer;
    width: 100%;
    min-height: 44px;
  }
  #mobile-back-btn:active { background: var(--bg-hover); }

  /* Mobile prev/next nav bar */
  #mobile-nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    min-height: 44px;
    gap: 8px;
  }
  #mobile-nav-bar button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--blue);
    font-size: 18px;
    line-height: 1;
    padding: 6px 14px;
    min-width: 44px;
    min-height: 36px;
    cursor: pointer;
  }
  #mobile-nav-bar button:disabled {
    color: var(--text-muted);
    border-color: var(--border);
    cursor: default;
  }
  #mobile-nav-bar button:not(:disabled):active { background: var(--bg-hover); }
  #mobile-nav-pos {
    font-size: 13px;
    color: var(--text-secondary);
    flex: 1;
    text-align: center;
  }

  /* R2: Header — stack logo + stats vertically; path-filter scrollable */
  .header {
    height: auto;
    flex-wrap: wrap;
    padding: 8px 12px;
    gap: 8px;
  }
  .header .logo span { font-size: 13px; }
  .header .divider { display: none; }
  .path-filter {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    scrollbar-width: none;
  }
  .path-filter::-webkit-scrollbar { display: none; }
  .stats {
    margin-left: 0;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
  }
  .stats .stat-group { font-size: 11px; }
  .trace-path-bar {
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 10px;
  }
  .trace-path-bar .tp-val {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #token-summary-bar {
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    padding: 6px 10px;
  }

  /* R3: Action buttons — stack vertically, min 44px touch target */
  .action-bar {
    display: flex;
    width: 100%;
    top: 0;
    padding: 8px;
    gap: 6px;
    border-radius: 10px;
    flex-direction: column;
  }
  .act-btn {
    width: 100%;
    min-height: 44px;
    justify-content: center;
    font-size: 13px;
    padding: 10px 16px;
  }

  /* R4: Detail panel — prevent horizontal overflow */
  .section-body { overflow-x: auto; }
  .section-body pre, .section-body .pre-text {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
    max-width: 100%;
  }
  .msg pre, .msg .pre-text {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
    max-width: 100%;
  }
  .content-block { overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
  .json-host { overflow-x: auto; max-width: 100%; }
  .token-bar { gap: 10px; }

  /* R5: Diff modal — full-screen */
  .diff-overlay {
    align-items: flex-start;
    padding: 0;
  }
  .diff-modal {
    width: 100vw;
    max-width: 100vw;
    max-height: 100vh;
    height: 100vh;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }
  .diff-header {
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 0;
    min-height: 52px;
  }
  .diff-header .diff-title { font-size: 13px; order: 1; flex: 1; }
  .diff-nav-btn { min-height: 44px; min-width: 44px; padding: 8px 12px; order: 0; }
  .diff-nav-prev { order: 0; }
  .diff-nav-next { order: 2; }
  .diff-header .diff-close { min-height: 44px; min-width: 44px; padding: 8px 12px; order: 3; font-size: 20px; }
  .diff-target-select {
    width: 100%;
    order: 10;
    margin-left: 0;
    margin-top: 4px;
  }
  .diff-target-select select { max-width: 100%; width: 100%; }
  .diff-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* R5: Side-by-side diff → each pair stacked on mobile */
  .sbs-diff {
    display: block;
    overflow-x: auto;
    max-height: none;
  }
  /* Hide the sticky headers; we show per-cell context via border colors */
  .sbs-diff .sbs-header { display: none; }
  /* Each pair of cells becomes a mini block */
  .sbs-cell {
    display: block;
    border-left: 3px solid transparent;
    border-bottom: 1px solid var(--border-light);
  }
  .sbs-cell.del { border-left-color: var(--red); }
  .sbs-cell.add { border-left-color: var(--green); }
  .sbs-cell.ctx { opacity: 0.5; }
  .sbs-cell.empty { display: none; }
  .sbs-fold { display: block; }

  /* R5: diff-side-by-side (parameters panel) → stacked */
  .diff-side-by-side { flex-direction: column; }
  .diff-side-by-side .diff-panel { min-width: 0; }

  /* R6: Search bar full-width */
  .search-bar input { font-size: 14px; }
  .global-search-overlay {
    left: 8px;
    right: 8px;
    top: 8px;
  }
  .global-search-box {
    width: 100%;
    gap: 6px;
  }
  .global-search-box input {
    width: auto;
    flex: 1;
  }

  /* Sidebar items: larger touch targets */
  .sidebar-item { min-height: 44px; padding: 12px 16px; }
  .sidebar-group-header { min-height: 44px; }
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span id="logo-text">claude-tap</span>
    <span class="logo-version" id="logo-version"></span>
  </div>
  <div class="divider"></div>
  <div class="path-filter" id="path-filter" style="display:none"></div>
  <div id="live-status" hidden></div>
  <div class="header-spacer"></div>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">&#9790;</button>
  <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="ar">العربية</option>
    <option value="de">Deutsch</option>
    <option value="ru">Русский</option>
  </select>
</div>

<div class="trace-path-bar" id="trace-path-bar"></div>
<div class="global-search-overlay" id="global-search-overlay">
  <div class="global-search-box">
    <input type="text" id="global-search-input" placeholder="Find in trace">
    <span class="global-search-count" id="global-search-count">0 of 0</span>
    <button class="global-search-btn" id="global-search-prev" type="button" title="Previous match (Shift+Enter)">Prev</button>
    <button class="global-search-btn" id="global-search-next" type="button" title="Next match (Enter)">Next</button>
    <button class="global-search-btn" id="global-search-close" type="button" title="Close (Escape)">Close</button>
  </div>
</div>

<div class="main" id="main-area">
  <div id="sidebar-wrap" hidden>
    <div id="session-picker" hidden>
      <label id="label-session">Session:</label>
      <select id="session-select" onchange="onSessionChange(this.value)"></select>
    </div>
    <div class="search-bar" id="search-bar">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search messages, tools, prompts..." oninput="onSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">&#10005;</button>
    </div>
    <div id="tool-filter" hidden></div>
    <div class="position-indicator" id="position-indicator">
      <span><span id="label-turn-prefix">Turn</span> <span class="pi-current" id="pi-current">0</span> <span class="pi-total"><span id="label-turn-of">of</span> <span id="pi-total-count">0</span></span></span>
      <div class="pi-bar"><div class="pi-fill" id="pi-fill"></div></div>
    </div>
    <div class="sidebar" id="sidebar"></div>
  </div>
  <button id="mobile-back-btn" onclick="mobileShowSidebar()" hidden>&#8592; Back to list</button>
  <div id="mobile-nav-bar" hidden>
    <button id="mobile-prev-btn" onclick="mobilePrev()" aria-label="Previous entry">&#8592;</button>
    <span id="mobile-nav-pos"></span>
    <button id="mobile-next-btn" onclick="mobileNext()" aria-label="Next entry">&#8594;</button>
  </div>
  <div class="drop-zone" id="drop-zone">
    <div class="drop-zone-inner" id="drop-inner">
      <h2 id="drop-title">Load Trace File</h2>
      <p id="drop-desc">Drag &amp; drop a .jsonl trace file, or click to browse</p>
      <label for="file-input" id="drop-btn-label">Choose File</label>
      <input type="file" id="file-input" accept=".jsonl,.json">
    </div>
  </div>
  <div class="detail" id="detail" hidden></div>
  <button id="back-to-top" class="back-to-top" title="Back to top" onclick="scrollDetailToTop()">↑</button>
</div>

<!-- claude-tap:inject -->

<script>
const $ = s => document.querySelector(s);
let entries = [], filtered = [], activeIdx = -1, activePaths = new Set(), searchQuery = '', activeTools = null;
// Path-filter chips auto-track every path until the user clicks one. Live mode
// brings new paths in over time (e.g. /v1/responses arriving after /v1/models),
// and without this flag those late paths would be silently filtered out.
let userTouchedPathFilter = false;
// Errors-only filter (set by the "Errors only" chip). Hides records with status < 400.
let errorsOnlyFilter = false;
let visualOrder = []; // filtered indices in sidebar visual (DOM) order, excludes collapsed items

/* ─── Lazy loading infrastructure ───
 * Records >LAZY_THRESHOLD live as light "stub" entries; their full body
 * is parsed on demand from a hidden <script type="text/plain"> element.
 * Avoids a 50MB JSON.parse storm on session open.
 */
const LAZY_THRESHOLD = 50;
// Detail panel currently shown — used to restore selection after re-render.
let currentDetailRequestId = null;
let rawLines = null;             // raw JSON strings, lazily extracted
const entryCache = new Map();    // record idx → parsed full entry

function getRawLines() {
  if (rawLines) return rawLines;
  const el = document.getElementById('trace-raw');
  if (!el) return [];
  const text = el.textContent;
  // Free DOM node memory — we no longer need the script element
  el.remove();
  rawLines = text.split('\n').filter(l => l.trim());
  return rawLines;
}

function buildStubEntry(meta, rawIdx) {
  // Build an entry object with the same shape as real entries so existing
  // sidebar rendering code works unchanged. Nested paths are constructed
  // to satisfy property access patterns (e.g. entry.request.body.model).
  const usage = {};
  if (meta.input_tokens) usage.input_tokens = meta.input_tokens;
  if (meta.output_tokens) usage.output_tokens = meta.output_tokens;
  if (meta.cache_read_input_tokens) usage.cache_read_input_tokens = meta.cache_read_input_tokens;
  if (meta.cache_creation_input_tokens) usage.cache_creation_input_tokens = meta.cache_creation_input_tokens;

  // Build a minimal system field to support task fingerprinting
  const body = { model: meta.model || '' };
  if (meta.has_system && meta.sys_hint) {
    body.system = meta.sys_hint;
  }
  if (meta.tool_names && meta.tool_names.length) {
    body.tools = meta.tool_names.map(n => ({ name: n }));
  }

  // Build minimal response content for tool filter
  const respContent = [];
  if (meta.response_tool_names && meta.response_tool_names.length) {
    meta.response_tool_names.forEach(n => respContent.push({ type: 'tool_use', name: n }));
  }

  return {
    _isStub: true,
    _rawIdx: rawIdx,
    turn: meta.turn,
    request_id: meta.request_id || '',
    timestamp: meta.timestamp || '',
    duration_ms: meta.duration_ms || 0,
    request: {
      method: meta.method || '',
      path: meta.path || '',
      body: body,
    },
    response: {
      status: meta.status || 0,
      body: {
        usage: usage,
        content: respContent.length ? respContent : undefined,
        error: meta.error_message ? { message: meta.error_message } : undefined,
      },
    },
  };
}

function getFullEntry(entry) {
  if (!entry._isStub) return entry;
  const idx = entry._rawIdx;
  if (entryCache.has(idx)) return entryCache.get(idx);
  const lines = getRawLines();
  if (idx < 0 || idx >= lines.length) return entry;
  try {
    const full = JSON.parse(lines[idx]);
    entryCache.set(idx, full);
    return full;
  } catch (e) {
    console.error('Failed to parse entry at index', idx, e);
    return entry;
  }
}

/* ─── Virtual scroll state ─── */
let virtualMode = false;
const VS_ITEM_HEIGHT = 68;
const VS_BUFFER = 10;
let vsFilteredItems = []; // {entry, idx} pairs for virtual scroll

const globalSearchState = {
  open: false,
  query: '',
  matchCounts: [],
  totalMatches: 0,
  currentMatch: -1,
  textCache: new Map(),

const CLAUDE_TAP_VERSION = typeof __CLAUDE_TAP_VERSION__ !== 'undefined' ? __CLAUDE_TAP_VERSION__ : '';

const I18N = {
  en: {
    title: "claude-tap",
    drop_title: "Load Trace File", drop_desc: "Drag & drop a .jsonl trace file, or click to browse", drop_btn: "Choose File",

    jump_to_turn: "Jump to turn:", go: "Go", cancel: "Cancel",
    closest_turn: "closest:", jumped_to_closest: "No turn ",
    expand_all: "Expand all", collapse_all: "Collapse all",
    errors_only: "Errors only", copy_response_text: "Copy response text",
    tip_request_json: "Copy request body as JSON",
    tip_curl: "Copy as cURL command",
    tip_diff_prev: "Diff this request against the previous one",
    tip_json_grid: "Compact grid view",
    tip_json_inline: "Inline (one line)",
    tip_json_wrap: "Toggle wrap",
    btn_request_json: "Request JSON", btn_curl: "cURL", btn_diff: "Diff with Prev",
    section_system: "System Prompt", section_messages: "Messages", section_tools: "Tools",
    section_response: "Response", section_sse: "SSE Events", section_json: "Full JSON",
    copy: "Copy", copied: "Copied!",
    params: "Parameters", required: "required",
    tok_input: "Input", tok_output: "Output", tok_cache_read: "Cache Read", tok_cache_create: "Cache Create",
    empty_state: "No entries for selected paths", no_prev: "No previous request",
    no_content: "No content", no_messages: "No messages in either request",
    diff_unchanged: "previous messages unchanged", diff_msg_range: "message #1 ~ #",

function detectLang() {
  const supported = ['en','zh-CN','ja','ko','fr','ar','de','ru'];
  const nav = navigator.language || navigator.userLanguage || 'en';
  if (supported.includes(nav)) return nav;
  const prefix = nav.split('-')[0];
  if (prefix === 'zh') return 'zh-CN';
  const match = supported.find(s => s.startsWith(prefix));
  return match || 'en';
}
let currentLang = localStorage.getItem('claude-tap-lang') || detectLang();
function t(key) { return (I18N[currentLang] || I18N.en)[key] || I18N.en[key] || key; }
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('claude-tap-lang', lang);
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  $('#lang-select').value = lang;
  updateStaticTexts();
  // Live status pill is built in JS — re-render after lang switch.
  if (typeof updateLiveStatus === 'function' && document.getElementById('live-status')) {
    try { updateLiveStatus(); } catch (_) {}
  }
  if (filtered.length) { applyFilter(); selectEntry(activeIdx >= 0 ? activeIdx : 0); }
}
function updateStaticTexts() {
  const e = id => document.getElementById(id);
  if (e('logo-text')) e('logo-text').textContent = t('title');
  if (e('logo-version')) {
    const rawVersion = String(CLAUDE_TAP_VERSION || '').trim();
    if (rawVersion) {
      e('logo-version').textContent = rawVersion.startsWith('v') ? rawVersion : `v${rawVersion}`;
      e('logo-version').style.display = 'inline-flex';
    } else {
      e('logo-version').style.display = 'none';
    }
  }
  document.title = t('title') + ' Viewer';
  if (e('drop-title')) e('drop-title').textContent = t('drop_title');
  if (e('drop-desc')) e('drop-desc').textContent = t('drop_desc');
  if (e('drop-btn-label')) e('drop-btn-label').textContent = t('drop_btn');
  if (e('search-input')) e('search-input').placeholder = t('search_placeholder');
  if (e('label-session')) e('label-session').textContent = t('label_session');
  if (e('label-turn-prefix')) e('label-turn-prefix').textContent = t('turn');
  if (e('label-turn-of')) e('label-turn-of').textContent = t('label_of');
  if (e('global-search-input')) e('global-search-input').placeholder = t('find_in_trace');
  if (e('global-search-prev')) e('global-search-prev').textContent = t('prev');
  if (e('global-search-next')) e('global-search-next').textContent = t('next');
  if (e('global-search-close')) e('global-search-close').textContent = t('close');
}

/* ─── Theme ─── */
function initTheme() {
  const saved = localStorage.getItem('claude-tap-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  applyTheme(theme);
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('claude-tap-theme', next);
}
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.dataset.theme = 'dark';
    $('#theme-toggle').textContent = '\u2600'; // sun
  } else {
    delete document.documentElement.dataset.theme;
    $('#theme-toggle').textContent = '\u263E'; // moon
  }
}

/* ─── Init ─── */
function initLang() {
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = currentLang;
  $('#lang-select').value = currentLang;
  updateStaticTexts();
}
/* ===========================================================================
   SECTION: Live mode

   When the page is served by `claude-tap proxy --live` / `claude-tap live`,
   the proxy injects:
       LIVE_MODE = true
       LIVE_SCHEMA = <int>            (protocol version we expect)
       CURRENT_SESSION_ID = "YYYY-MM-DD/HHMMSS" | null

   We talk to:
       GET /api/sessions              list sessions (history + current)
       GET /api/sessions/{id}         records of a single session
       GET /api/stream                SSE: hello | record | heartbeat

   The page is always *viewing one session*. Switching to a historical
   session does not close the SSE stream; new records arriving for the
   live session are counted as "pending" until the user switches back.
   ========================================================================= */

let liveStreamSource = null;
let liveCurrentSessionId = null;     // server-reported current session
let viewingSessionId = null;         // session currently shown in the UI
let pendingNewCount = 0;             // records arrived while viewing history
let liveRenderTimer = null;

async function bootstrapLive() {
  if (typeof CURRENT_SESSION_ID !== 'undefined' && CURRENT_SESSION_ID) {
    liveCurrentSessionId = CURRENT_SESSION_ID;
    viewingSessionId = CURRENT_SESSION_ID;
  }
  // Sidebar is always visible in live mode so the user can switch sessions
  // even before the first request lands.
  $('#sidebar-wrap').hidden = false;
  updateLiveStatus('connecting');
  await fetchSessions();
  if (viewingSessionId) {
    await loadSessionRecords(viewingSessionId);
  } else {
    showWaitingPlaceholder();
  }
  openLiveStream();
}

function showWaitingPlaceholder() {
  $('#drop-zone').innerHTML =
    '<div class="live-waiting">' +
    '<div class="live-waiting-icon">📡</div>' +
    `<h2>${t('live_waiting_title')}</h2>` +
    `<p>${t('live_waiting_desc')}</p>` +
    '</div>';
}

async function fetchSessions() {
  try {
    const r = await fetch('/api/sessions');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (data.current) liveCurrentSessionId = data.current;
    populateSessionPicker(data.sessions || []);
  } catch (e) {
    console.error('fetchSessions failed:', e);
  }
}

function populateSessionPicker(sessions) {
  const sel = $('#session-select');
  if (!sel) return;
  sel.innerHTML = '';
  // Group sessions by date so the picker reads naturally (newest first).
  const byDate = new Map();
  for (const s of sessions) {
    if (!byDate.has(s.date)) byDate.set(s.date, []);
    byDate.get(s.date).push(s);
  }
  for (const [date, list] of byDate) {
    const og = document.createElement('optgroup');
    og.label = date;
    for (const s of list) {
      const opt = document.createElement('option');
      opt.value = s.id;
      const t = s.id.split('/')[1] || '';
      const time = `${t.slice(0,2)}:${t.slice(2,4)}:${t.slice(4,6)}`;
      const isLive = s.id === liveCurrentSessionId;
      opt.textContent = `${time} · ${s.record_count} record${s.record_count === 1 ? '' : 's'}${isLive ? ' · live' : ''}`;
      if (s.id === viewingSessionId) opt.selected = true;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  const picker = $('#session-picker');
  if (picker) picker.hidden = false;
}

async function loadSessionRecords(sessionId) {
  try {
    const r = await fetch('/api/sessions/' + sessionId);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    entries = data.records || [];
    activeIdx = -1;
    renderApp();
    autoSelectFirst();
    updateLiveStatus();
  } catch (e) {
    console.error('loadSessionRecords failed:', e);
  }
}

async function onSessionChange(id) {
  viewingSessionId = id;
  pendingNewCount = 0;
  await loadSessionRecords(id);
}

function openLiveStream() {
  liveStreamSource = new EventSource('/api/stream');
  liveStreamSource.addEventListener('hello', e => {
    try {
      const data = JSON.parse(e.data);
      if (data.session) {
        liveCurrentSessionId = data.session;
        if (!viewingSessionId) {
          viewingSessionId = data.session;
          loadSessionRecords(data.session);
        }
      }
      if (data.schema && typeof LIVE_SCHEMA !== 'undefined' && data.schema !== LIVE_SCHEMA) {
        console.warn(`viewer/server schema mismatch (page=${LIVE_SCHEMA}, server=${data.schema}); refresh recommended`);
      }
    } catch (err) { console.warn('SSE hello frame parse failed:', err); }
    updateLiveStatus('connected');
  });
  liveStreamSource.addEventListener('record', e => {
    let record;
    try { record = JSON.parse(e.data); } catch (_) { return; }
    if (viewingSessionId === liveCurrentSessionId) {
      entries.push(record);
      clearTimeout(liveRenderTimer);
      // Coalesce a burst of records into one render.
      liveRenderTimer = setTimeout(() => renderApp(true), 50);
    } else {
      pendingNewCount++;
      updateLiveStatus('connected');
    }
  });
  liveStreamSource.addEventListener('heartbeat', () => {
    updateLiveStatus('connected');
  });
  liveStreamSource.onopen = () => updateLiveStatus('connected');
  liveStreamSource.onerror = () => updateLiveStatus('disconnected');
}

function updateLiveStatus(forcedStatus) {
  const el = $('#live-status');
  if (!el) return;
  el.hidden = false;
  const status = forcedStatus
    || (liveStreamSource && liveStreamSource.readyState === 1 ? 'connected' : 'disconnected');
  const colors = {
    connecting:   { bg: 'var(--amber-bg)', color: 'var(--amber)', dot: 'var(--amber)' },
    connected:    { bg: 'var(--green-bg)', color: 'var(--green)', dot: 'var(--green)' },
    disconnected: { bg: 'var(--red-bg)', color: 'var(--red)', dot: 'var(--red)' },
  };
  const c = colors[status] || colors.connecting;
  let label;
  if (status === 'connected') {
    const isLive = viewingSessionId === liveCurrentSessionId;
    label = isLive
      ? `Live · ${entries.length}`
      : (pendingNewCount > 0 ? `${t('live_elsewhere')} · +${pendingNewCount}` : t('live_history_view'));
  } else {
    label = status === 'connecting' ? (t('connecting') || 'Connecting…') : (t('disconnected') || 'Disconnected');
  }
  el.style.background = c.bg;
  el.style.color = c.color;
  const animClass = status === 'connected' ? ' is-live' : '';
  el.innerHTML = `<span class="live-status-dot${animClass}" style="background:${c.dot}"></span>${label}`;
}

/* ===========================================================================
   SECTION: Bootstrap

   Four mutually exclusive entry points decide where ``entries`` come from:
     1. LIVE_MODE        → fetch from /api/* and stream new records
     2. EMBEDDED_TRACE_META  → static export, large trace, lazy parse
     3. EMBEDDED_TRACE_DATA  → static export, small trace, fully inline
     4. None of the above → user opened the HTML directly; show drop zone
   ========================================================================= */

function bootCommon() { initTheme(); initLang(); initGlobalSearch(); initToolFilterEvents(); initBackToTop(); initShortcuts(); initHashRouting(); }

// Global keyboard shortcuts.
// ``/`` focuses the sidebar search box; ``Esc`` clears + blurs it. We
// skip when the user is already typing in some other input/textarea so
// we don't intercept their search.
function initShortcuts() {
  document.addEventListener('keydown', e => {
    const target = e.target;
    const inEditable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
    if (e.key === '/' && !inEditable && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const inp = document.getElementById('search-input');
      if (inp) { inp.focus(); inp.select(); e.preventDefault(); }
    } else if (e.key === 'Escape') {
      const inp = document.getElementById('search-input');
      if (inp && document.activeElement === inp) {
        inp.value = '';
        if (typeof onSearch === 'function') onSearch('');
        inp.blur();
        e.preventDefault();
      }
    }
  });
}

// URL hash deep-linking. ``#turn=N`` selects the turn with that number
// when the page loads, and is updated when the user navigates between
// turns — so a copy/paste of the URL re-opens the same turn. Uses
// history.replaceState to avoid bloating the back-button stack.
function initHashRouting() {
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#turn=(\d+)/);
    if (!m) return;
    const want = parseInt(m[1], 10);
    const idx = filtered.findIndex(e => (e?.turn ?? null) === want);
    if (idx >= 0 && idx !== activeIdx) selectEntry(idx);
  });
}
function readHashTurnIdx() {
  const m = location.hash.match(/^#turn=(\d+)/);
  if (!m) return -1;
  const want = parseInt(m[1], 10);
  return filtered.findIndex(e => (e?.turn ?? null) === want);
}

// Show the back-to-top button when ``.detail`` is scrolled past 200px,
// and scroll smoothly back when clicked.
function initBackToTop() {
  const detail = document.getElementById('detail');
  const btn = document.getElementById('back-to-top');
  if (!detail || !btn) return;
  detail.addEventListener('scroll', () => {
    btn.classList.toggle('show', detail.scrollTop > 200);
  }, { passive: true });
}
function scrollDetailToTop() {
  const detail = document.getElementById('detail');
  if (detail) detail.scrollTo({ top: 0, behavior: 'smooth' });
}

function bootRenderEmbedded() { bootCommon(); renderApp(); autoSelectFirst(); }

function bootDropZone() {
  bootCommon();
  const dropInner = $('#drop-inner'), fileInput = $('#file-input');
  ['dragover', 'dragenter'].forEach(e => dropInner.addEventListener(e, ev => { ev.preventDefault(); dropInner.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(e => dropInner.addEventListener(e, () => dropInner.classList.remove('dragover')));
  dropInner.addEventListener('drop', ev => { ev.preventDefault(); if (ev.dataTransfer.files.length) loadFile(ev.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });
}

if (typeof LIVE_MODE !== 'undefined' && LIVE_MODE) {
  document.addEventListener('DOMContentLoaded', () => { bootCommon(); bootstrapLive(); });
} else if (typeof EMBEDDED_TRACE_META !== 'undefined' && EMBEDDED_TRACE_META.length) {
  entries = EMBEDDED_TRACE_META.map((meta, i) => buildStubEntry(meta, i));
  document.addEventListener('DOMContentLoaded', bootRenderEmbedded);
} else if (typeof EMBEDDED_TRACE_DATA !== 'undefined' && EMBEDDED_TRACE_DATA.length) {
  entries = EMBEDDED_TRACE_DATA;
  document.addEventListener('DOMContentLoaded', bootRenderEmbedded);
} else {
  document.addEventListener('DOMContentLoaded', bootDropZone);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.trim().split('\n');
    let skipped = 0;
    entries = lines.map((line, idx) => {
      try { return JSON.parse(line); }
      catch (err) { skipped++; console.warn(`line ${idx + 1}: skipped malformed JSON`, err); return null; }
    }).filter(Boolean);
    if (!entries.length) { alert('No valid entries found / 未找到有效条目'); return; }
    if (skipped) console.warn(`loaded ${entries.length} records; skipped ${skipped} malformed line(s)`);
    activeIdx = -1;
    renderApp();
    autoSelectFirst();
  };
  reader.readAsText(file);
}

/* On first paint, auto-select the first entry so the detail panel never
 * shows up empty. We skip this if the user has already picked something. */
function autoSelectFirst() {
  if (activeIdx >= 0 || filtered.length === 0) return;
  const hashIdx = readHashTurnIdx();
  selectEntry(hashIdx >= 0 ? hashIdx : 0);
}

/* ─── Path & filter ─── */
function getPath(e) {
  // Some captured forward-mode requests come in with leading "//host/path"
  // because the original URL was an absolute one. Trim the duplicated slash
  // so the sidebar / chip display reads cleanly.
  return (e.request?.path || '/unknown').replace(/\?.*$/, '').replace(/^\/{2,}/, '/');
}

function renderApp(preserveDetail) {
  $('#drop-zone').hidden = true;
  $('#sidebar-wrap').hidden = false;
  $('#detail').hidden = false;
  $('#path-filter').style.display = '';
  const pathCounts = {};
  entries.forEach(e => { const p = getPath(e); pathCounts[p] = (pathCounts[p] || 0) + 1; });
  const paths = Object.keys(pathCounts).sort();
  if (!userTouchedPathFilter) {
    /* Auto-mode: re-derive on every render so new paths from live records
       get included. Few paths → activate all; many paths → only primary. */
    activePaths = new Set();
    const primaryPaths = paths.filter(isPathPrimary);
    if (paths.length <= 5 || primaryPaths.length === 0) paths.forEach(p => activePaths.add(p));
    else primaryPaths.forEach(p => activePaths.add(p));
  }
  renderPathFilter(paths, pathCounts);
  renderTracePathBar();
  applyFilter(preserveDetail);
}

function renderTracePathBar() {
  const bar = $('#trace-path-bar');
  if (!TRACE_JSONL_PATH && !TRACE_HTML_PATH) return;
  const copyIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
  let html = '';
  if (TRACE_JSONL_PATH) {
    html += `<span class="tp-label">JSONL</span><span class="tp-val" title="${esc(TRACE_JSONL_PATH)}">${esc(TRACE_JSONL_PATH)}</span><button class="tp-copy" title="Copy path" onclick="copyPath('${esc(TRACE_JSONL_PATH)}',this)">${copyIcon}</button>`;
  }
  if (TRACE_JSONL_PATH && TRACE_HTML_PATH) html += '<span class="tp-sep"></span>';
  if (TRACE_HTML_PATH) {
    html += `<span class="tp-label">HTML</span><span class="tp-val" title="${esc(TRACE_HTML_PATH)}">${esc(TRACE_HTML_PATH)}</span><button class="tp-copy" title="Copy path" onclick="copyPath('${esc(TRACE_HTML_PATH)}',this)">${copyIcon}</button>`;
  }
  bar.innerHTML = html;
  bar.style.display = 'flex';
}
function copyPath(text, btn) {
  copyToClipboard(text, btn, '✓');
}

function getResponseStatus(e) {
  return Number(e?.response?.status || 0);
}

function getResponseErrorMessage(e) {
  const message = e?.response?.body?.error?.message;
  if (typeof message === 'string' && message.trim()) return message.trim();
  return 'Unknown error';
}

function onCopySuccess(btn, copiedLabel = null) {
  if (!btn) return;
  const orig = btn.innerHTML;
  btn.textContent = copiedLabel || t('copied');
  setTimeout(() => { btn.innerHTML = orig; }, 1500);
}

function fallbackCopyText(text) {
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) resolve();
      else reject(new Error('execCommand(copy) failed'));
    } catch (err) {
      reject(err);
    }
  });
}

function writeClipboardText(text) {
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
  }
  return fallbackCopyText(text);
}

function copyToClipboard(text, btn, copiedLabel = null) {
  writeClipboardText(text).then(() => {
    onCopySuccess(btn, copiedLabel);
  }).catch(err => {
    console.error('Clipboard copy failed:', err);
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.textContent = '!';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  });
}

let pathFilterExpanded = false;

/*
 * Path priority tiers:
 *   primary   – core AI conversation endpoints, always visible
 *   secondary – useful auxiliary APIs (MCP, models, token counting), collapsed behind "+N more"
 *   noise     – plugin manifests, bot APIs, asset downloads, version checks — hidden by default
 */
const PRIMARY_PATH_PREFIXES = ['/v1/messages', '/v1/responses', '/v1/chat/completions', '/v1/completions'];
const SECONDARY_PATH_PREFIXES = ['/v1/mcp', '/v1/models', '/v1/embeddings', '/responses', '/models', '/chat/completions', '/completions'];
function pathTier(p) {
  if (PRIMARY_PATH_PREFIXES.some(pfx => p.startsWith(pfx))) return 0;
  if (SECONDARY_PATH_PREFIXES.some(pfx => p.startsWith(pfx))) return 1;
  return 2;
}
function isPathPrimary(p) { return pathTier(p) === 0; }

function renderPathFilter(paths, pathCounts) {
  const c = $('#path-filter'); c.innerHTML = '';
  const buckets = [[], [], []]; /* primary, secondary, noise */
  paths.forEach(p => buckets[pathTier(p)].push(p));
  buckets.forEach(b => b.sort((a, bb) => pathCounts[bb] - pathCounts[a]));

  /* Always show primary */
  buckets[0].forEach(p => c.appendChild(makeFilterChip(p, pathCounts[p])));

  const hiddenPaths = [...buckets[1], ...buckets[2]];
  if (hiddenPaths.length > 0) {
    if (pathFilterExpanded) {
      buckets[1].forEach(p => c.appendChild(makeFilterChip(p, pathCounts[p])));
      buckets[2].forEach(p => c.appendChild(makeFilterChip(p, pathCounts[p])));
    }
    const toggle = document.createElement('button');
    toggle.className = 'filter-chip-toggle';
    toggle.title = pathFilterExpanded ? t('filter_less') : hiddenPaths.map(p => p).join('\n');
    toggle.textContent = pathFilterExpanded ? t('filter_less') : `+${hiddenPaths.length} ${t('filter_more')}`;
    toggle.onclick = () => { pathFilterExpanded = !pathFilterExpanded; renderPathFilter(paths, pathCounts); };
    c.appendChild(toggle);
  }

  // Errors-only toggle: only renders when at least one record is ≥400.
  const hasErrors = entries.some(e => (getResponseStatus(e) || 0) >= 400);
  if (hasErrors) {
    const errBtn = document.createElement('button');
